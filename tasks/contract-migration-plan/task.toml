schema = "harness-e2e-task/v1"
id = "contract_migration_plan"
version = 1
kind = "planning"

[source]
kind = "embedded_directory"
path = "tests/fixtures/repository-tasks/contract-migration-plan"
manifest_sha256 = "sha256:fd6f61eac84b405a8c117357679c4f594723dea047ad9e1bca818766ba7c4fe3"
required_paths = ["consumer/client.py", "consumer/contract.json", "producer/contract.json", "producer/profile_api.py"]

[execution]
max_turns = 32
max_output_tokens = 16384
max_total_tokens = 300000
stuck_timeout_seconds = 600

[workspace]
mutation = "artifact_only"
allowed_paths = ["migration-plan.json"]
protected_paths = ["consumer", "producer"]
ignored_paths = ["__pycache__/", "*.py[cod]", ".pytest_cache/"]
minimum_changed_files = 1
maximum_changed_files = 1
maximum_patch_lines = 180

[verifier]
profile = "structured_artifact"
spec = "verifier.json"

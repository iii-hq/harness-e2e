schema = "harness-e2e-task/v1"
id = "bugfix_config_precedence"
version = 1
kind = "code_patch"

[source]
kind = "embedded_directory"
path = "tests/fixtures/repository-tasks/bugfix-config-precedence"
manifest_sha256 = "sha256:a430448e07f105c6cbe7e1ce11b8508ea026f6ecc6cb39dfb142da442f8a5d5f"
required_paths = ["src/__init__.py", "src/config_cache.py", "src/config_loader.py", "tests/test_config.py"]

[execution]
max_turns = 40
max_output_tokens = 16384
max_total_tokens = 400000
stuck_timeout_seconds = 600

[workspace]
mutation = "allowlisted"
allowed_paths = ["src/config_cache.py", "src/config_loader.py"]
protected_paths = ["tests", "src/__init__.py"]
ignored_paths = ["__pycache__/", "*.py[cod]", ".pytest_cache/"]
minimum_changed_files = 2
maximum_changed_files = 2
maximum_patch_lines = 80

[verifier]
profile = "code_patch"
spec = "verifier.json"

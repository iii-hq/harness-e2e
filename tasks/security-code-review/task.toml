schema = "harness-e2e-task/v2"
id = "security_code_review"
version = 2
kind = "code_review"
execution_mode = "single_turn"

[source]
kind = "git_checkout"
repository = "iii-hq/e2e-fixture"
revision = "5e9bf8fd77bafc42ad7d62b99b3b84f1b1d35029"
subtree = "native-tasks/security-code-review"
path_env = "HARNESS_E2E_TASK_FIXTURE_PATH"
manifest_sha256 = "sha256:c82d10a8961e1bcaeef5e4574f80d6c73e933e81a7722c10ce8b66bef14eef3b"
required_paths = [".env.example", ".github/workflows/insecure.yml", "README.md", "package-lock.json", "package.json", "src/vulnerable.rs"]

[execution]
max_turns = 32
max_output_tokens = 16384
max_total_tokens = 300000
stuck_timeout_seconds = 600

[workspace]
mutation = "artifact_only"
allowed_paths = ["review.json"]
protected_paths = [".env.example", ".github", "README.md", "package-lock.json", "package.json", "src"]
ignored_paths = ["node_modules/", ".npm/"]
minimum_changed_files = 1
maximum_changed_files = 1
maximum_patch_lines = 120

[verifier]
profile = "structured_artifact"
spec = "verifier.json"

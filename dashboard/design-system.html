<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Harness E2E design system foundations and primitive component demonstration."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Harness E2E design system</title>
    <script>
      ;(() => {
        const stored = localStorage.getItem('harness-e2e-theme')
        const theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>JavaScript is required to view the design system.</noscript>
    <script type="module" src="/src/design-system/main.tsx"></script>
  </body>
</html>

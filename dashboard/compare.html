<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Compare two Harness E2E executions." />
    <meta name="color-scheme" content="dark light" />
    <title>Compare Harness E2E executions</title>
    <script>
      ;(() => {
        const stored = localStorage.getItem('harness-e2e-theme')
        const theme = stored === 'light' || stored === 'dark'
          ? stored
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root" data-page="compare"></div>
    <noscript>JavaScript is required to compare Harness E2E executions.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

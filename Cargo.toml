[package]
name = "harness-e2e"
version = "0.6.11-experimental"
edition = "2021"
description = "Longitudinal capability and complexity evaluation for Harness stacks"
license = "Apache-2.0"
repository = "https://github.com/iii-hq/harness-e2e"
publish = false

[[bin]]
name = "harness-e2e"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.23.0-rc.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "net", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
axum = { version = "0.7", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
mime_guess = "2"
rust-embed = { version = "8", features = ["include-exclude"] }
url = "2"
sha2 = "0.10"
jsonschema = { version = "0.18", default-features = false }
base64 = "0.22"
async-trait = "0.1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
shakmaty = "0.30.1"

[dev-dependencies]
tempfile = "3"

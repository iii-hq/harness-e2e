name: Publish the executor image

# The image every phase of an execution runs in (Dockerfile). Its tag is a
# digest of the Dockerfile, so a change there is a new tag, published once
# from main; an existing tag is never rebuilt. Until a tag is published,
# scripts/run_in_image.sh builds it where it runs, with a warning.
on:
  push:
    branches: [main]
    paths: [Dockerfile]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: executor-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Build and push the tag this Dockerfile names
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image=$(scripts/run_in_image.sh image)
          printf '%s\n' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Only the registry saying it has no such tag lets this publish:
          # any other answer could hide a tag this would overwrite. "denied"
          # is how GHCR answers for a package that does not exist yet, and it
          # cannot hide one either: a token that may push the tag may read it.
          if answer=$(docker manifest inspect "$image" 2>&1); then
            echo "::notice::$image is already published"
            exit 0
          elif ! grep -qiE 'manifest unknown|no such manifest|name unknown|not found|denied' <<<"$answer"; then
            echo "::error::could not tell whether $image is published: $answer"
            exit 1
          fi
          docker build --tag "$image" - <Dockerfile
          docker push "$image"
          echo "::notice::published $(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"

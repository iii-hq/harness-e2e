name: Release harness-e2e worker

on:
  workflow_dispatch:
    inputs:
      identity: {required: true, type: string}
      source_sha: {required: true, type: string}
      candidate_version: {required: true, type: string}
      stable_version: {required: true, type: string}
      descriptor_sha256: {required: true, type: string}
      descriptor_run_id: {required: true, type: string}
      descriptor_artifact: {required: true, type: string}

permissions:
  contents: read

concurrency:
  group: release-harness-e2e-${{ fromJSON(inputs.identity).candidate_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
  RELEASE_IDENTITY_JSON: ${{ inputs.identity }}
  RELEASE_OPERATION_ID: ${{ fromJSON(inputs.identity).operation_id }}
  RELEASE_STEP_ID: ${{ fromJSON(inputs.identity).step_id }}
  RELEASE_INTENT_ID: ${{ fromJSON(inputs.identity).release_intent_id }}
  RELEASE_CANDIDATE_ID: ${{ fromJSON(inputs.identity).candidate_id }}
  RELEASE_ATTEMPT_ID: ${{ fromJSON(inputs.identity).attempt_id }}
  RELEASE_DISPATCH_NONCE: ${{ fromJSON(inputs.identity).dispatch_nonce }}
  RELEASE_PLAN_HASH: ${{ fromJSON(inputs.identity).plan_hash }}
  RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
  RELEASE_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
  RELEASE_STABLE_VERSION: ${{ inputs.stable_version }}
  RELEASE_DESCRIPTOR_SHA256: ${{ inputs.descriptor_sha256 }}

jobs:
  validate:
    name: Validate immutable release identity
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      frontend_runtime_version: ${{ steps.frontend.outputs.runtime_version }}
      frontend_package_manager_version: ${{ steps.frontend.outputs.package_manager_version }}
      frontend_lockfile: ${{ steps.frontend.outputs.lockfile }}
      frontend_lock_sha256: ${{ steps.frontend.outputs.lock_sha256 }}
      rust_toolchain_version: ${{ steps.frontend.outputs.rust_toolchain_version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ inputs.descriptor_artifact }}
          path: release-descriptor-index
          run-id: ${{ inputs.descriptor_run_id }}
          github-token: ${{ github.token }}
      - name: Validate compact release identity
        run: |
          jq -e '
            type == "object" and
            (keys | sort) == ["attempt_id", "candidate_id", "dispatch_nonce", "operation_id", "plan_hash", "release_intent_id", "step_id"] and
            all(.[]; type == "string" and length > 0)
          ' <<< "$RELEASE_IDENTITY_JSON"
      - name: Restore the compiled descriptor selected by Release Control
        run: |
          set -euo pipefail
          compiler=$(jq -r .commit .github/release-compiler.json)
          jq -e \
            --arg source "$RELEASE_SOURCE_SHA" \
            --arg compiler "$compiler" \
            --arg digest "$RELEASE_DESCRIPTOR_SHA256" \
            --arg version "$RELEASE_CANDIDATE_VERSION" \
            '.contract == "release-descriptor-index" and .source_sha == $source and .compiler_sha == $compiler and .workers["harness-e2e"] == {path:"descriptors/harness-e2e.json",digest:$digest,version:$version,publish:true}' \
            release-descriptor-index/release-descriptor-index.json
          cp release-descriptor-index/descriptors/harness-e2e.json release-descriptor.json
      - name: Validate compiled identity and authorize dispatch
        id: release
        env:
          RELEASE_CONTROL_API_URL: ${{ vars.RELEASE_CONTROL_API_URL }}
        run: |
          set -euo pipefail
          python3 scripts/release_worker.py validate-descriptor \
            --descriptor release-descriptor.json \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --descriptor-sha256 "$RELEASE_DESCRIPTOR_SHA256" \
            --version "$RELEASE_CANDIDATE_VERSION"
          python3 scripts/release_control_contract.py validate-dispatch \
            --operation-id "$RELEASE_OPERATION_ID" \
            --step-id "$RELEASE_STEP_ID" \
            --dispatch-nonce "$RELEASE_DISPATCH_NONCE" \
            --descriptor-sha256 "$RELEASE_DESCRIPTOR_SHA256" \
            --plan-hash "$RELEASE_PLAN_HASH" \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --mutating
          python3 scripts/release_control_contract.py authorize-dispatch \
            --api-url "$RELEASE_CONTROL_API_URL" \
            --repository '${{ github.repository }}' \
            --operation-id "$RELEASE_OPERATION_ID" \
            --step-id "$RELEASE_STEP_ID" \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --workflow 'release.yml' \
            --event '${{ github.event_name }}' \
            --sha '${{ github.sha }}' \
            --release-intent-id "$RELEASE_INTENT_ID" \
            --candidate-id "$RELEASE_CANDIDATE_ID" \
            --attempt-id "$RELEASE_ATTEMPT_ID" \
            --dispatch-nonce "$RELEASE_DISPATCH_NONCE" \
            --plan-hash "$RELEASE_PLAN_HASH" \
            --worker harness-e2e \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --descriptor-sha256 "$RELEASE_DESCRIPTOR_SHA256"
      - name: Derive immutable asset tag
        id: identity
        run: printf 'tag=harness-e2e/v%s\n' "$RELEASE_CANDIDATE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Read descriptor-owned build toolchains
        id: frontend
        run: python3 scripts/release_worker.py frontend-metadata --descriptor release-descriptor.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: harness-release-descriptor-${{ fromJSON(inputs.identity).candidate_id }}
          path: release-descriptor.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate release helper
        run: python3 -m py_compile scripts/release_worker.py scripts/release_control_contract.py

  dashboard:
    name: Build immutable dashboard bundle
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: harness-release-descriptor-${{ fromJSON(inputs.identity).candidate_id }}
          path: release-descriptor-input
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: ${{ needs.validate.outputs.frontend_package_manager_version }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ needs.validate.outputs.frontend_runtime_version }}
          cache: pnpm
          cache-dependency-path: ${{ needs.validate.outputs.frontend_lockfile }}
      - name: Build descriptor-declared frontend outputs
        run: >-
          python3 scripts/release_worker.py build-frontends
          --descriptor release-descriptor-input/release-descriptor.json
          --out .release-frontend
      - name: Fingerprint dashboard bytes
        run: |
          set -euo pipefail
          test -f dashboard/dist/index.html
          test -f dashboard/dist-console/page.js
          test -f dashboard/dist-console/styles.css
          find dashboard/dist dashboard/dist-console -type f -print0 |
            LC_ALL=C sort -z |
            xargs -0 sha256sum > dashboard-dist.sha256
          sha256sum dashboard-dist.sha256
          cp dashboard-dist.sha256 .release-frontend/dashboard-dist.sha256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dashboard-dist
          path: .release-frontend/
          if-no-files-found: error
          retention-days: 1

  campaign-assets:
    name: Build immutable campaign assets
    needs: [validate, dashboard]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_KEY_PREFIX: sccache/${{ needs.validate.outputs.rust_toolchain_version }}/harness-e2e/campaign-assets
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dashboard-dist
          path: release-frontend
      - name: Restore dashboard bundle
        run: |
          mkdir -p dashboard/dist dashboard/dist-console
          cp -a release-frontend/dashboard/dist/. dashboard/dist/
          cp -a release-frontend/dashboard/dist-console/. dashboard/dist-console/
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ needs.validate.outputs.rust_toolchain_version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: harness-e2e-campaign-assets-${{ needs.validate.outputs.commit_sha }}
      - name: Validate and materialize campaign assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ needs.validate.outputs.commit_sha }}
          SKIP_DASHBOARD_BUILD: '1'
        run: |
          set -euo pipefail
          mkdir -p target/campaign-assets
          for manifest in config/campaigns/*.json; do
            python3 scripts/run_e2e_campaign.py "$manifest" --validate-only
          done
          cargo run --locked --quiet --bin harness-e2e -- catalog \
            > target/campaign-assets/scenario-catalog.json
          python3 scripts/build_campaign_assets.py \
            --version "$VERSION" \
            --revision "$REVISION" \
            --catalog target/campaign-assets/scenario-catalog.json \
            --output target/campaign-assets/campaign-assets.json
          source_date_epoch=$(git show -s --format=%ct "$REVISION")
          tar --sort=name --mtime="@$source_date_epoch" --owner=0 --group=0 \
            --numeric-owner --format=gnu -cf - \
            config/campaigns config/scoring config/profiles \
            target/campaign-assets/scenario-catalog.json \
            target/campaign-assets/campaign-assets.json |
            gzip -n > "target/harness-e2e-campaign-assets-${VERSION}.tar.gz"
          sha256sum "target/harness-e2e-campaign-assets-${VERSION}.tar.gz" \
            > "target/harness-e2e-campaign-assets-${VERSION}.tar.gz.sha256"
      - name: Record campaign build cache metrics
        if: always()
        run: sccache --show-stats | tee sccache-campaign-assets.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: harness-cache-campaign-${{ fromJSON(inputs.identity).candidate_id }}
          path: sccache-campaign-assets.txt
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: harness-campaign-assets-${{ fromJSON(inputs.identity).candidate_id }}
          path: |
            target/harness-e2e-campaign-assets-${{ needs.validate.outputs.version }}.tar.gz
            target/harness-e2e-campaign-assets-${{ needs.validate.outputs.version }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: Build ${{ matrix.target }}
    needs: [validate, dashboard]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_KEY_PREFIX: sccache/${{ needs.validate.outputs.rust_toolchain_version }}/harness-e2e/${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: [self-hosted, macOS, X64, workers-release-macos-12core]
          - target: aarch64-apple-darwin
            os: [self-hosted, macOS, X64, workers-release-macos-12core]
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: i686-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dashboard-dist
          path: release-frontend
      - name: Restore and verify dashboard bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dashboard/dist dashboard/dist-console
          mkdir -p dashboard/dist dashboard/dist-console
          cp -a release-frontend/dashboard/dist/. dashboard/dist/
          cp -a release-frontend/dashboard/dist-console/. dashboard/dist-console/
          python3 - <<'PY'
          import hashlib
          import pathlib

          for line in pathlib.Path('release-frontend/dashboard-dist.sha256').read_text().splitlines():
              expected, relative = line.split(maxsplit=1)
              path = pathlib.Path(relative)
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'dashboard digest mismatch: {path}')
          PY
      - name: Install cross-compilation tools
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          sudo apt-get update
          case "$BUILD_TARGET" in
            x86_64-unknown-linux-musl)
              sudo apt-get install -y musl-tools
              ;;
            aarch64-unknown-linux-gnu)
              sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
              ;;
            armv7-unknown-linux-gnueabihf)
              sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
              ;;
          esac
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ needs.validate.outputs.rust_toolchain_version }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: harness-e2e-${{ matrix.target }}-${{ needs.validate.outputs.commit_sha }}
      - name: Build immutable binary
        shell: bash
        env:
          SKIP_DASHBOARD_BUILD: '1'
        run: cargo build --locked --release --target '${{ matrix.target }}' --bin harness-e2e
      - name: Record target cache metrics
        if: always()
        shell: bash
        run: sccache --show-stats | tee sccache-${{ matrix.target }}.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: harness-cache-${{ matrix.target }}-${{ fromJSON(inputs.identity).candidate_id }}
          path: sccache-${{ matrix.target }}.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Package exact build output
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == *windows* ]]; then
            binary="target/$TARGET/release/harness-e2e.exe"
          else
            binary="target/$TARGET/release/harness-e2e"
          fi
          python3 scripts/release_worker.py package-binary \
            --binary "$binary" \
            --target "$TARGET" \
            --out release-output
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: harness-binary-${{ matrix.target }}-${{ fromJSON(inputs.identity).candidate_id }}
          path: release-output/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish prepared GitHub assets
    needs: [validate, binaries, campaign-assets]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: harness-binary-*-${{ fromJSON(inputs.identity).candidate_id }}
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: harness-campaign-assets-${{ fromJSON(inputs.identity).candidate_id }}
          path: release-assets
      - name: Create the immutable tag and prerelease from prepared bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.commit_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          remote_ref=$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')
          if [[ -n "$remote_ref" ]]; then
            remote_commit=$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')
            test "${remote_commit:-$remote_ref}" = "$SOURCE_SHA"
          else
            git tag -a "$RELEASE_TAG" "$SOURCE_SHA" \
              -m "worker: harness-e2e" \
              -m "version: $VERSION" \
              -m "descriptor-sha256: $RELEASE_DESCRIPTOR_SHA256"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f | sort)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir -p remote-assets
            missing=()
            for asset in "${assets[@]}"; do
              name=$(basename "$asset")
              if gh release view "$RELEASE_TAG" --json assets \
                --jq '.assets[].name' | grep -Fxq "$name"; then
                gh release download "$RELEASE_TAG" --pattern "$name" --dir remote-assets
                cmp --silent "$asset" "remote-assets/$name" || {
                  echo "::error::immutable release asset differs: $name"
                  exit 1
                }
              else
                missing+=("$asset")
              fi
            done
            if (( ${#missing[@]} > 0 )); then
              gh release upload "$RELEASE_TAG" "${missing[@]}"
            fi
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --prerelease \
              --title "harness-e2e $VERSION" --generate-notes
          fi

  registry-next:
    name: Collect typed interface and publish next
    needs: [validate, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: workers-registry-next
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: harness-release-descriptor-${{ fromJSON(inputs.identity).candidate_id }}
          path: release-descriptor-input
      - name: Install release tooling
        run: python3 -m pip install --quiet pyyaml
      - name: Install checksum-pinned iii CLI
        env:
          III_VERSION: '0.23.0-rc.7'
          III_TARGET: x86_64-unknown-linux-gnu
          III_ARCHIVE_SHA256: a64afb84fe0fd466db15ae6598f82914a8b6829fe934c3eb084c6558a5e39b03
        run: |
          set -euo pipefail
          asset="iii-${III_TARGET}.tar.gz"
          url="https://github.com/iii-hq/iii/releases/download/iii/v${III_VERSION}/${asset}"
          mkdir -p iii-tools
          curl --fail --location --retry 3 "$url" --output "iii-tools/$asset"
          printf '%s  %s\n' "$III_ARCHIVE_SHA256" "iii-tools/$asset" | sha256sum --check --strict
          tar -xzf "iii-tools/$asset" -C iii-tools iii
          chmod 755 iii-tools/iii
          iii-tools/iii --version | grep -F "$III_VERSION"
          printf '%s\n' "$GITHUB_WORKSPACE/iii-tools" >> "$GITHUB_PATH"
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets release-worker
          gh release download "$RELEASE_TAG" \
            --pattern 'harness-e2e-*.sha256' \
            --dir release-assets
          gh release download "$RELEASE_TAG" \
            --pattern 'harness-e2e-x86_64-unknown-linux-gnu.tar.gz' \
            --dir release-assets
          tar -xzf release-assets/harness-e2e-x86_64-unknown-linux-gnu.tar.gz \
            -C release-worker
          chmod +x release-worker/harness-e2e
      - name: Start isolated iii engine
        run: |
          set -euo pipefail
          mkdir -p interface-project interface-compose-state target/interface-collection
          printf 'workers: []\n' > interface-project/config.yaml
          (
            cd interface-project
            exec iii --config config.yaml --no-update-check
          ) > iii-engine.log 2>&1 &
          echo "$!" > iii-engine.pid
          for _ in {1..60}; do
            if ! kill -0 "$(cat iii-engine.pid)" 2>/dev/null; then
              echo "::error::iii engine exited before becoming ready"
              exit 1
            fi
            if iii trigger 'engine::workers::list' --json '{}' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::iii engine did not become ready"
          exit 1
      - name: Start isolated Compose daemon
        run: |
          set -euo pipefail
          III_COMPOSE_STATE_DIR="$GITHUB_WORKSPACE/interface-compose-state" \
            iii compose \
              --engine ws://127.0.0.1:49134 \
              --namespace release-interface-daemon \
              > compose-daemon.log 2>&1 &
          echo "$!" > compose-daemon.pid
          for _ in {1..60}; do
            if ! kill -0 "$(cat compose-daemon.pid)" 2>/dev/null; then
              echo "::error::Compose daemon exited before becoming ready"
              exit 1
            fi
            if iii trigger compose::list \
              --namespace release-interface-daemon --json '{}' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Compose daemon did not become ready"
          exit 1
      - name: Materialize publication Compose files
        run: |
          set -euo pipefail
          jq -n '{
            namespace: "release-interface",
            startup_timeout: "2m",
            stop_timeout: "30s",
            containers: {
              state: {worker: "package://state", version: "0.22.2"}
            }
          }' > baseline-compose.yaml
          jq -n --arg data_dir "$GITHUB_WORKSPACE/target/interface-collection" '{
            namespace: "release-interface",
            startup_timeout: "2m",
            stop_timeout: "30s",
            containers: {
              state: {worker: "package://state", version: "0.22.2"},
              "harness-e2e": {
                worker: "path://.",
                depends_on: ["state"],
                scripts: {run: "./release-worker/harness-e2e worker"},
                config_name: "release-interface-harness-e2e",
                config_override: {data_dir: $data_dir}
              }
            }
          }' > interface-compose.yaml
      - name: Capture baseline through Compose
        run: |
          set -euo pipefail
          baseline="$GITHUB_WORKSPACE/baseline-compose.yaml"
          iii trigger compose::validate --namespace release-interface-daemon "file=$baseline"
          iii trigger compose::up --namespace release-interface-daemon "file=$baseline"
          iii trigger compose::status --namespace release-interface-daemon "file=$baseline" \
            > baseline-compose-status.json
          for _ in {1..60}; do
            if iii trigger 'state::list' \
              --namespace release-interface \
              --json '{"scope":"__harness_e2e_release_probe__"}' >/dev/null 2>&1; then
              iii trigger 'engine::workers::list' --json '{}' > baseline-workers.json
              iii trigger 'engine::triggers::list' \
                --json '{"include_internal": false}' > baseline-triggers.json
              iii trigger compose::down --namespace release-interface-daemon "file=$baseline"
              exit 0
            fi
            sleep 1
          done
          echo "::error::baseline state package did not register state::list"
          exit 1
      - name: Validate and start local release candidate through Compose
        run: |
          set -euo pipefail
          compose_file="$GITHUB_WORKSPACE/interface-compose.yaml"
          iii trigger compose::validate --namespace release-interface-daemon "file=$compose_file" \
            > interface-compose-validate.json
          iii trigger compose::up --namespace release-interface-daemon "file=$compose_file" \
            > interface-compose-up.json
          iii trigger compose::status --namespace release-interface-daemon "file=$compose_file" \
            > interface-compose-status.json
      - name: Collect and require typed interface
        run: |
          python3 scripts/release_worker.py collect-interface \
            --baseline-workers baseline-workers.json \
            --baseline-triggers baseline-triggers.json \
            --wait-seconds 120 \
            --out worker-interface.json
      - name: Build Registry payload for next
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          python3 scripts/release_worker.py build-payload \
            --descriptor release-descriptor-input/release-descriptor.json \
            --tag "$RELEASE_TAG" \
            --repo-url "$REPOSITORY_URL" \
            --interface worker-interface.json \
            --checksums-dir release-assets \
            --out registry-payload.json
      - name: POST immutable release to Registry next
        env:
          API_URL: https://api.workers.iii.dev
          API_KEY: ${{ secrets.WORKERS_REGISTRY_API_KEY }}
          WORKER: harness-e2e
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$API_KEY" ]]; then
            echo "::error::WORKERS_REGISTRY_API_KEY is not configured"
            exit 1
          fi
          http=$(curl -sS -o registry-response.json -w '%{http_code}' \
            -H "X-API-Key: $API_KEY" \
            -H 'Content-Type: application/json' \
            -X POST "$API_URL/publish" \
            --data-binary @registry-payload.json)
          if [[ "$http" == '409' ]]; then
            resolve_http=$(curl -sS -o registry-resolve.json -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -X POST "$API_URL/resolve" \
              --data "$(jq -cn --arg worker "$WORKER" '{worker: $worker, version: "next"}')")
            resolved=$(jq -r '.root.version // empty' registry-resolve.json)
            if [[ "$resolve_http" != '200' || "$resolved" != "$VERSION" ]]; then
              echo "::error::HTTP 409 was not an idempotent retry; next does not resolve to $VERSION"
              exit 1
            fi
            echo "::notice::$WORKER@$VERSION already published on next"
          elif [[ "$http" != '200' && "$http" != '201' ]]; then
            echo "::error::Registry publish failed with HTTP $http"
            exit 1
          fi
      - name: Dump interface logs
        if: failure()
        run: |
          echo "::group::iii engine"
          tail -n 200 iii-engine.log || true
          echo "::endgroup::"
          echo "::group::Compose daemon"
          tail -n 200 compose-daemon.log || true
          echo "::endgroup::"
      - name: Stop interface processes
        if: always()
        run: |
          if [[ -f compose-daemon.pid ]]; then
            for file in "$GITHUB_WORKSPACE/interface-compose.yaml" "$GITHUB_WORKSPACE/baseline-compose.yaml"; do
              iii trigger compose::down --namespace release-interface-daemon "file=$file" >/dev/null 2>&1 || true
            done
            iii trigger compose::stop --namespace release-interface-daemon --json '{}' >/dev/null 2>&1 || true
            kill "$(cat compose-daemon.pid)" 2>/dev/null || true
          fi
          if [[ -f iii-engine.pid ]]; then
            kill "$(cat iii-engine.pid)" 2>/dev/null || true
          fi

  report:
    name: Report byte-exact release result
    if: ${{ always() }}
    needs: [validate, binaries, campaign-assets, github-release, registry-next]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: scripts/release_control_contract.py
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        continue-on-error: true
        with:
          pattern: harness-binary-*-${{ fromJSON(inputs.identity).candidate_id }}
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        continue-on-error: true
        with:
          name: harness-campaign-assets-${{ fromJSON(inputs.identity).candidate_id }}
          path: release-assets
      - name: Write one terminal result
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BINARIES_RESULT: ${{ needs.binaries.result }}
          CAMPAIGN_RESULT: ${{ needs['campaign-assets'].result }}
          GITHUB_RESULT: ${{ needs['github-release'].result }}
          REGISTRY_RESULT: ${{ needs['registry-next'].result }}
        run: |
          set -euo pipefail
          outcome=succeeded
          error=null
          github_state=present
          registry_state=present
          if [[ "$VALIDATE_RESULT" == cancelled || "$BINARIES_RESULT" == cancelled || "$CAMPAIGN_RESULT" == cancelled || "$GITHUB_RESULT" == cancelled || "$REGISTRY_RESULT" == cancelled ]]; then
            outcome=canceled
            error='{"code":"harness_release_canceled","category":"release","retryable":true,"message":"Harness release execution was canceled"}'
            github_state=unknown
            registry_state=unknown
          elif [[ "$VALIDATE_RESULT" != success || "$BINARIES_RESULT" != success || "$CAMPAIGN_RESULT" != success || "$GITHUB_RESULT" != success || "$REGISTRY_RESULT" != success ]]; then
            outcome=failed
            error='{"code":"harness_release_failed","category":"release","retryable":true,"message":"Harness release did not complete"}'
            if [[ "$GITHUB_RESULT" == skipped ]]; then github_state=absent; elif [[ "$GITHUB_RESULT" != success ]]; then github_state=unknown; fi
            if [[ "$REGISTRY_RESULT" == skipped ]]; then registry_state=absent; elif [[ "$REGISTRY_RESULT" != success ]]; then registry_state=unknown; fi
          fi
          artifacts=$(python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          values=[]
          for path in sorted(Path("release-assets").glob("*")):
              if not path.is_file() or path.name.endswith(".sha256"):
                  continue
              body=path.read_bytes()
              role="campaign-assets" if "campaign-assets" in path.name else "binary"
              values.append({"name":path.name,"role":role,"sha256":hashlib.sha256(body).hexdigest(),"size":len(body)})
          print(json.dumps(values, separators=(",", ":")))
          PY
          )
          effects=$(jq -nc \
            --arg github_state "$github_state" \
            --arg registry_state "$registry_state" \
            --arg tag "harness-e2e/v$RELEASE_CANDIDATE_VERSION" \
            --arg version "$RELEASE_CANDIDATE_VERSION" \
            '[{surface:"github-release",state:$github_state,immutable_id:$tag},{surface:"registry-next",state:$registry_state,after:$version}]')
          python3 scripts/release_control_contract.py write-result \
            --repository '${{ github.repository }}' \
            --operation-id "$RELEASE_OPERATION_ID" \
            --step-id "$RELEASE_STEP_ID" \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --workflow release.yml \
            --event '${{ github.event_name }}' \
            --sha '${{ github.sha }}' \
            --release-intent-id "$RELEASE_INTENT_ID" \
            --candidate-id "$RELEASE_CANDIDATE_ID" \
            --attempt-id "$RELEASE_ATTEMPT_ID" \
            --dispatch-nonce "$RELEASE_DISPATCH_NONCE" \
            --plan-hash "$RELEASE_PLAN_HASH" \
            --worker harness-e2e \
            --phase harness_release \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --prepared-sha "$RELEASE_SOURCE_SHA" \
            --candidate-version "$RELEASE_CANDIDATE_VERSION" \
            --stable-version "$RELEASE_STABLE_VERSION" \
            --descriptor-sha256 "$RELEASE_DESCRIPTOR_SHA256" \
            --outcome "$outcome" \
            --effects "$effects" \
            --artifacts-json "$artifacts" \
            --error-json "$error" \
            --output release-result.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-result-${{ fromJSON(inputs.identity).candidate_id }}-${{ fromJSON(inputs.identity).step_id }}-attempt-${{ github.run_attempt }}
          path: release-result.json
          if-no-files-found: error
          retention-days: 30
      - name: Send the exact result bytes to Release Control
        env:
          RELEASE_CONTROL_API_URL: ${{ vars.RELEASE_CONTROL_API_URL }}
        run: |
          python3 scripts/release_control_contract.py post-result \
            --api-url "$RELEASE_CONTROL_API_URL" \
            --result release-result.json

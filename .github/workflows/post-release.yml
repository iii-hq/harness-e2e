name: Harness E2E post-release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-e2e-post-release
  cancel-in-progress: false

jobs:
  post-release:
    uses: ./.github/workflows/run-campaign.yml
    with:
      campaign: post-release
      timeout_minutes: 360
    secrets: inherit

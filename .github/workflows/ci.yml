name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HARNESS_E2E_TASK_FIXTURE_PATH: ${{ github.workspace }}/target/fixtures/native-task-fixtures
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Mint read-only native task fixture token
        id: fixture-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.III_CI_APP_ID }}
          private-key: ${{ secrets.III_CI_APP_PRIVATE_KEY }}
          owner: iii-hq
          repositories: e2e-fixture
          permission-contents: read
      - name: Checkout pinned native task fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: iii-hq/e2e-fixture
          ref: 5e9bf8fd77bafc42ad7d62b99b3b84f1b1d35029
          token: ${{ steps.fixture-token.outputs.token }}
          persist-credentials: false
          path: target/fixtures/native-task-fixtures
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.13.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm --dir dashboard install --frozen-lockfile
      - run: pnpm --dir dashboard typecheck
      - run: pnpm --dir dashboard lint
      - run: pnpm --dir dashboard test
      - run: pnpm --dir dashboard build
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Validate Markdown scenarios and author versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]] &&
            git cat-file -e "$BASE_SHA:scenarios" 2>/dev/null &&
            git diff --quiet "$BASE_SHA" -- config/campaigns; then
            scenario_base=$(mktemp -d)
            git archive "$BASE_SHA" scenarios | tar -x -C "$scenario_base"
            cargo run --locked -- validate-scenarios --base-directory "$scenario_base/scenarios"
          else
            cargo run --locked -- validate-scenarios
          fi
          cargo run --locked -- tasks validate
      - name: Verify repository independence
        run: |
          cargo metadata --locked --format-version 1 --no-deps > metadata.json
          if jq -e '.packages[].dependencies[] | select(.source == null or (.source | startswith("git+")))' metadata.json >/dev/null; then
            echo 'product path and Git dependencies are forbidden' >&2
            exit 1
          fi
          if rg 'use[[:space:]]+harness::|harness[[:space:]]*=[[:space:]]*\{' src Cargo.toml; then
            echo 'Harness source dependencies are forbidden' >&2
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: node --test tests/dashboard/*.test.cjs
      - run: python3 -m unittest discover -s tests/python -p 'test_*.py'

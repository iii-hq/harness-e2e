name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.13.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      # The Alertmanager delegation probe builds upstream Go code in its tests.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - run: pnpm --dir dashboard install --frozen-lockfile
      - run: pnpm --dir dashboard typecheck
      - run: pnpm --dir dashboard lint
      - run: pnpm --dir dashboard test
      - run: pnpm --dir dashboard build
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build the runner the browser flows drive
        run: cargo build --locked --bin harness-e2e
      - name: Install the Engine for packaged Registry validation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/registry-smoke-bin"
          curl -fsSL --retry 3 \
            https://github.com/iii-hq/iii/releases/download/iii/v0.24.4-rc.1/iii-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/registry-smoke-cli.tar.gz"
          printf '%s  %s\n' \
            8cd32ed7164dcb89a5c0c85a1d9130e96a44572db4399dc8dcc1c255d53e9572 \
            "$RUNNER_TEMP/registry-smoke-cli.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/registry-smoke-cli.tar.gz" -C "$RUNNER_TEMP/registry-smoke-bin"
          echo "$RUNNER_TEMP/registry-smoke-bin" >> "$GITHUB_PATH"
          python3 -m pip install --quiet pyyaml
      - name: Validate packaged Registry installation and restart
        run: |
          python3 scripts/smoke_registry_install.py \
            --binary target/debug/harness-e2e \
            --output target/registry-install-smoke
      - name: Retain Registry installation failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: registry-install-smoke
          if-no-files-found: ignore
          path: |
            target/registry-install-smoke/*.log
            target/registry-install-smoke/worker-compose.*
            target/registry-install-smoke/registry-resolution.json
            target/registry-install-smoke/compose-state/**/logs/*.log
      - name: Validate the Console browser flows
        run: |
          pnpm --dir dashboard exec playwright install --with-deps chromium
          pnpm --dir dashboard test:profiles
      - name: Verify repository independence
        run: |
          cargo metadata --locked --format-version 1 --no-deps > metadata.json
          if jq -e '.packages[].dependencies[] | select(.source == null or (.source | startswith("git+")))' metadata.json >/dev/null; then
            echo 'product path and Git dependencies are forbidden' >&2
            exit 1
          fi
          if rg 'use[[:space:]]+harness::|harness[[:space:]]*=[[:space:]]*\{' src Cargo.toml; then
            echo 'Harness source dependencies are forbidden' >&2
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: node --test tests/dashboard/*.test.cjs
      - name: Verify trending topics evaluator and delivery contracts
        run: |
          node --test tests/fixtures/trending-topics-build/evaluator.test.mjs
          python3 -m unittest -v tests/fixtures/trending-topics-build/test_lifecycle.py
      - name: Verify Python contracts
        env:
          HARNESS_E2E_BIN: ${{ github.workspace }}/target/debug/harness-e2e
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -m unittest discover -s tests/python -p 'test_*.py'

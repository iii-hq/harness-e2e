name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Prepare SWE execution isolation
        run: scripts/install_bwrap.sh
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.13.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm --dir dashboard install --frozen-lockfile
      - run: pnpm --dir dashboard typecheck
      - run: pnpm --dir dashboard lint
      - run: pnpm --dir dashboard test
      - run: pnpm --dir dashboard build
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build the runner the browser flows drive
        run: cargo build --locked --bin harness-e2e
      - name: Validate executable plan browser flows
        run: |
          pnpm --dir dashboard exec playwright install --with-deps chromium
          pnpm --dir dashboard test:profiles
          pnpm --dir dashboard test:references
      - name: Verify repository independence
        run: |
          cargo metadata --locked --format-version 1 --no-deps > metadata.json
          if jq -e '.packages[].dependencies[] | select(.source == null or (.source | startswith("git+")))' metadata.json >/dev/null; then
            echo 'product path and Git dependencies are forbidden' >&2
            exit 1
          fi
          if rg 'use[[:space:]]+harness::|harness[[:space:]]*=[[:space:]]*\{' src Cargo.toml; then
            echo 'Harness source dependencies are forbidden' >&2
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: node --test tests/dashboard/*.test.cjs
      - name: Verify trending topics evaluator and delivery contracts
        run: |
          node --test tests/fixtures/trending-topics-build/evaluator.test.mjs
          python3 -m unittest -v tests/fixtures/trending-topics-build/test_lifecycle.py
      - name: Prepare the isolated SWE verifier runtime
        run: docker pull python@sha256:1042b61448fef4ba92d16a8c7eb4996d027568ce64792a7877fd88511e0af7c6
      - name: Verify Python contracts and OS isolation
        env:
          SWE_REQUIRE_OS_ISOLATION: "1"
          HARNESS_E2E_BIN: ${{ github.workspace }}/target/debug/harness-e2e
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -m unittest discover -s tests/python -p 'test_*.py'

  kanban-catalog:
    # bootstrap.py rejects a fixture whose catalog is not byte-identical to the
    # runner-embedded one, and it does so only once a campaign is already
    # running: run 34979011694 lost all seven Kanban groups to that drift.
    # Catch it on the pull request that introduces it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: pin
        name: Read the pinned fixture revision
        run: |
          revision=$(sed -n "s/^FIXTURE_REVISION = '\([0-9a-f]\{40\}\)'.*/\1/p" scripts/kanban_eval/bootstrap.py)
          test -n "$revision" || { echo 'FIXTURE_REVISION is unreadable' >&2; exit 1; }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: iii-hq/kanban-e2e-fixture
          ref: ${{ steps.pin.outputs.revision }}
          path: target/kanban-fixture
          persist-credentials: false
      - name: Compare the fixture catalog with the runner-embedded catalog
        run: |
          if ! cmp -s target/kanban-fixture/scenarios/catalog.json src/scenarios/kanban/catalog.json; then
            echo 'The pinned Kanban fixture catalog and the runner-embedded catalog differ.' >&2
            echo 'Publish the synchronized catalog to iii-hq/kanban-e2e-fixture, then repin it in' >&2
            echo 'scripts/kanban_eval/bootstrap.py, .github/workflows/exact-stack-e2e.yml,' >&2
            echo 'tests/python/test_kanban_bootstrap.py and scripts/kanban_eval/README.md.' >&2
            diff -u src/scenarios/kanban/catalog.json target/kanban-fixture/scenarios/catalog.json || true
            exit 1
          fi

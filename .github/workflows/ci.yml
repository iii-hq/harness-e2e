name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify repository independence
        run: |
          cargo metadata --locked --format-version 1 --no-deps > metadata.json
          if jq -e '.packages[].dependencies[] | select(.source == null or (.source | startswith("git+")))' metadata.json >/dev/null; then
            echo 'product path and Git dependencies are forbidden' >&2
            exit 1
          fi
          if rg 'use[[:space:]]+harness::|harness[[:space:]]*=[[:space:]]*\{' src Cargo.toml; then
            echo 'Harness source dependencies are forbidden' >&2
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test dashboard/*.test.cjs
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

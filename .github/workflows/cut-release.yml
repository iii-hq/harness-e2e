name: Cut a harness-e2e release

run-name: Cut ${{ inputs.bump }} release

# A release is a version and a tag on main. This workflow writes the next
# version into Cargo.toml and Cargo.lock, commits that on main, tags the commit
# and pushes the tag last: the tag push runs release.yml, which builds, publishes
# the Registry candidate to `next` and promotes it to `latest`.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to move
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      expected_current_version:
        description: Newest release today, e.g. 0.11.19-experimental (blank to skip the check)
        required: false
        default: ''
        type: string

# Tagging is the one thing this repository lets a workflow write, and only
# here. Every other workflow stays `contents: read`.
permissions:
  contents: read

concurrency:
  group: harness-e2e-cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: Stamp the version and tag main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: harness-e2e-trusted
    steps:
      # A token the default GITHUB_TOKEN cannot replace: a tag pushed with
      # GITHUB_TOKEN starts no workflow run, so release.yml would never see it.
      - name: Mint the release-tagging token
        id: tagger
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.III_CI_APP_ID }}
          private-key: ${{ secrets.III_CI_APP_PRIVATE_KEY }}
          owner: iii-hq
          repositories: harness-e2e
          permission-contents: write

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.tagger.outputs.token }}

      - name: Resolve the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPECTED_CURRENT: ${{ inputs.expected_current_version }}
        run: |
          set -euo pipefail
          python3 scripts/cut_release.py resolve \
            --bump "$BUMP" \
            --expected-current "$EXPECTED_CURRENT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Stamp the version into the manifest and the lock
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/cut_release.py set-version --version "$VERSION"
          python3 -m py_compile scripts/release_worker.py
          # The tag, the manifest and the lock must agree: release.yml refuses
          # a tag whose Cargo.toml disagrees, and `cargo build --locked` there
          # refuses a lock that disagrees with the manifest.
          python3 - "$VERSION" <<'CHECK'
          import pathlib
          import sys
          import tomllib

          version = sys.argv[1]
          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          if manifest["package"]["version"] != version:
              raise SystemExit(f"Cargo.toml says {manifest['package']['version']}, not {version}")
          locked = [
              entry for entry in tomllib.loads(pathlib.Path("Cargo.lock").read_text(encoding="utf-8"))["package"]
              if entry["name"] == "harness-e2e"
          ]
          if [entry["version"] for entry in locked] != [version]:
              raise SystemExit(f"Cargo.lock says {[e['version'] for e in locked]}, not [{version!r}]")
          CHECK

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "Release harness-e2e $VERSION"
          git tag -a "$TAG" -m "harness-e2e $VERSION"
          git push origin HEAD:main
          # Pushed last and on its own: this is what starts release.yml.
          git push origin "refs/tags/$TAG"

      - name: Summarize the cut
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CURRENT: ${{ steps.version.outputs.current_version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "### Cut \`$VERSION\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| previous release | \`$CURRENT\` |"
            echo "| new version | \`$VERSION\` |"
            echo "| tag | \`$TAG\` |"
            echo
            echo "\`release.yml\` is now building this tag: binaries, the GitHub release,"
            echo "the Registry candidate on \`next\` and its promotion to \`latest\`."
          } >>"$GITHUB_STEP_SUMMARY"

name: Release Descriptor Index

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit; defaults to the dispatched workflow SHA
        required: false
        type: string

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_KEY_PREFIX: sccache/1.97.1/release-descriptor-compiler
    steps:
      - name: Resolve source identity
        id: source
        env:
          REQUESTED: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          sha="${REQUESTED:-${GITHUB_SHA}}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Validate immutable compiler pin
        id: compiler
        run: python3 scripts/release_compiler.py --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ steps.compiler.outputs.repository }}
          ref: ${{ steps.compiler.outputs.commit }}
          path: release-compiler
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.SCCACHE_ROLE_ARN }}
          aws-region: ${{ vars.SCCACHE_REGION }}
      - uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9
      - name: Compile the pinned descriptor compiler
        env:
          MANIFEST: ${{ steps.compiler.outputs.cargo_manifest }}
          BINARY: ${{ steps.compiler.outputs.binary }}
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path "release-compiler/$MANIFEST" --bin "$BINARY"
          echo "III_BIN=$GITHUB_WORKSPACE/release-compiler/target/release/$BINARY" >> "$GITHUB_ENV"
      - name: Compile the canonical descriptor index
        run: |
          set -euo pipefail
          "$III_BIN" compose descriptor-index \
            --file worker-compose.yaml \
            --source-sha '${{ steps.source.outputs.sha }}' \
            --compiler-sha '${{ steps.compiler.outputs.commit }}' \
            --output-dir release-descriptor-index
          jq -e \
            --arg source '${{ steps.source.outputs.sha }}' \
            --arg compiler '${{ steps.compiler.outputs.commit }}' \
            '.contract == "release-descriptor-index" and .source_sha == $source and .compiler_sha == $compiler and (.workers | keys) == ["harness-e2e"]' \
            release-descriptor-index/release-descriptor-index.json
      - name: Record compiler cache metrics
        if: always()
        run: sccache --show-stats | tee release-descriptor-sccache.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-descriptor-index-${{ steps.source.outputs.sha }}
          path: release-descriptor-index/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: release-descriptor-cache-${{ steps.source.outputs.sha }}
          path: release-descriptor-sccache.txt
          if-no-files-found: warn
          retention-days: 7

name: Harness E2E weekly stress

on:
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:
    inputs:
      repetitions:
        description: Minimum executions per fault profile
        type: number
        default: 3
      soak_minutes:
        description: Minimum wall time per fault profile
        type: number
        default: 60

permissions:
  contents: read

concurrency:
  group: harness-e2e-weekly-stress
  cancel-in-progress: false

jobs:
  stress:
    if: endsWith(github.workflow_ref, '@refs/heads/main')
    runs-on: [self-hosted, harness-e2e]
    environment: harness-e2e-trusted
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: weekly-l4-recovery
            scenario: coordination.4
          - profile: weekly-l5-recovery
            scenario: coordination.5
          - profile: weekly-l5-cancellation
            scenario: coordination.5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm --dir dashboard install --frozen-lockfile
      - run: pnpm --dir dashboard build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the trusted evaluator
        run: cargo build --locked --release --bin harness-e2e
      - name: Require environment-owned fault launchers
        run: |
          test -x /opt/iii-harness-e2e/run-weekly-stress
          test -x /opt/iii-harness-e2e/archive-trusted-execution
      - name: Exercise the fault profile
        env:
          PROFILE: ${{ matrix.profile }}
          SCENARIO: ${{ matrix.scenario }}
          REPETITIONS: ${{ inputs.repetitions || 3 }}
          SOAK_MINUTES: ${{ inputs.soak_minutes || 60 }}
        run: |
          [[ "$REPETITIONS" =~ ^[0-9]+$ ]] && (( REPETITIONS >= 1 && REPETITIONS <= 20 ))
          [[ "$SOAK_MINUTES" =~ ^[0-9]+$ ]] && (( SOAK_MINUTES >= 0 && SOAK_MINUTES <= 180 ))
          profile_path="config/profiles/${PROFILE}.json"
          root="stress/${PROFILE}"
          mkdir -p "$root"
          target/release/harness-e2e fault-plan \
            --profile "$profile_path" \
            --output "$root/fault-plan.json"
          deadline=$(( SECONDS + SOAK_MINUTES * 60 ))
          iteration=0
          while (( iteration < REPETITIONS || SECONDS < deadline )); do
            iteration=$(( iteration + 1 ))
            output="$root/run-${iteration}"
            mkdir -p "$output"
            /opt/iii-harness-e2e/run-weekly-stress \
              --e2e-bin "$PWD/target/release/harness-e2e" \
              --profile "$PWD/$profile_path" \
              --plan "$PWD/$root/fault-plan.json" \
              --scenario "$SCENARIO" \
              --iteration "$iteration" \
              --output "$PWD/$output"
            evaluation=(
              target/release/harness-e2e fault-evaluate
              --profile "$profile_path"
              --plan "$root/fault-plan.json"
              --journal "$output/fault-journal.json"
              --output "$output/fault-evaluation.json"
            )
            if [[ "$(jq -r .expected_outcome "$profile_path")" == recovered ]]; then
              evaluation+=(--results "$output/results")
            fi
            "${evaluation[@]}"
            execution_id=$(jq -r .execution_id "$output/fault-journal.json")
            /opt/iii-harness-e2e/archive-trusted-execution \
              --execution-id "$execution_id" \
              --retention longitudinal \
              --include "$root/fault-plan.json" \
              --include "$output/fault-journal.json" \
              --include "$output/fault-evaluation.json" \
              --output "$output/archive-head.json"
            jq -e '
              .availability == "available" and
              (.archive.manifest.uri | startswith("iii-storage://")) and
              ((.archive.manifest.sha256 | sub("^sha256:"; "") | length) == 64)
            ' "$output/archive-head.json"
          done
      - name: Retain a short diagnostic fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-stress-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: stress/${{ matrix.profile }}
          retention-days: 30
          if-no-files-found: warn

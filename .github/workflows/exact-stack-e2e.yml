name: Execute exact-stack Harness E2E campaign
run-name: E2E · ${{ inputs.execution_id }}

# Release Control names one execution, one profile of the master test plan and
# one stack policy. Everything else — which scenarios that profile expands to,
# which stack versions `latest` means today, how the groups are sharded — is
# resolved here, from the commit pinned by `runner_sha`, and reported back.
on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: Release Control execution UUID
        required: true
        type: string
      plan:
        description: The test plan JSON Release Control dispatched
        required: true
        type: string
      stack:
        description: Stack policy JSON — {"policy":"latest"} or {"versions":{...}}
        required: true
        type: string
      runner_sha:
        description: Immutable Harness E2E executor commit
        required: true
        type: string
      cli_version:
        description: Exact iii CLI release the campaign installs
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: harness-e2e-exact-stack-${{ inputs.execution_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Materialize the profile and resolve the stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: harness-e2e-trusted
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      runner_revision: ${{ inputs.runner_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.runner_sha }}
          persist-credentials: false

      - name: Validate Release Control dispatch
        env:
          RELEASE_CONTROL_BOT_LOGIN: ${{ vars.RELEASE_CONTROL_BOT_LOGIN }}
          RELEASE_CONTROL_API_URL: ${{ vars.RELEASE_CONTROL_API_URL }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_CONTROL_BOT_LOGIN"
          test "$GITHUB_ACTOR" = "$RELEASE_CONTROL_BOT_LOGIN"
          test "$GITHUB_TRIGGERING_ACTOR" = "$RELEASE_CONTROL_BOT_LOGIN"
          test -n "$RELEASE_CONTROL_API_URL"
          [[ '${{ inputs.execution_id }}' =~ ^[0-9a-f-]{36}$ ]]
          [[ '${{ inputs.runner_sha }}' =~ ^[0-9a-f]{40}$ ]]

      - name: Record the dispatch
        env:
          PLAN: ${{ inputs.plan }}
          STACK: ${{ inputs.stack }}
        run: |
          set -euo pipefail
          mkdir -p target/harness-e2e-contract
          jq -e 'objects' <<<"$PLAN" >target/harness-e2e-contract/plan.json
          jq -e 'objects' <<<"$STACK" >target/harness-e2e-contract/stack.json

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.97.1
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .
          key: harness-e2e-plan-${{ inputs.runner_sha }}

      # The binary embeds the dashboard SPA, so building it needs the same
      # Node and pnpm the finalizer sets up. `SKIP_DASHBOARD_BUILD` is not a
      # way out: it requires a `dashboard/dist` that is never committed.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.13.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Build the campaign catalog
        run: cargo build --locked --bin harness-e2e

      - name: Materialize the requested profile
        id: profile
        run: |
          set -euo pipefail
          profile=$(jq -er '.profile.id' target/harness-e2e-contract/plan.json)
          ./target/debug/harness-e2e test-plan materialize --profile "$profile" \
            >target/harness-e2e-contract/profile.json
          jq -e '.campaigns | length > 0' target/harness-e2e-contract/profile.json >/dev/null

      # Posted before anything runs and before the stack is resolved: this is
      # what tells Release Control which shards to expect, so a campaign that
      # dies during resolution is still a campaign it knows the shape of.
      - name: Report the materialized profile
        env:
          RELEASE_CONTROL_API_URL: ${{ vars.RELEASE_CONTROL_API_URL }}
          RELEASE_CONTROL_OIDC_AUDIENCE: ${{ vars.RELEASE_CONTROL_OIDC_AUDIENCE || 'release-control-harness-e2e' }}
        run: |
          python3 scripts/report_execution.py materialized \
            --execution-id '${{ inputs.execution_id }}' \
            --oidc-audience "$RELEASE_CONTROL_OIDC_AUDIENCE" \
            --profile-snapshot target/harness-e2e-contract/profile.json \
            --plan target/harness-e2e-contract/plan.json \
            --runner-sha '${{ inputs.runner_sha }}' \
            --cli-version '${{ inputs.cli_version }}'

      - name: Resolve the exact stack this campaign runs on
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_CONTROL_OIDC_AUDIENCE: ${{ vars.RELEASE_CONTROL_OIDC_AUDIENCE || 'release-control-harness-e2e' }}
        run: |
          set -euo pipefail
          python3 scripts/resolve_stack_lock.py \
            --execution-id '${{ inputs.execution_id }}' \
            --profile-snapshot target/harness-e2e-contract/profile.json \
            --plan target/harness-e2e-contract/plan.json \
            --stack "$(cat target/harness-e2e-contract/stack.json)" \
            --cli-version '${{ inputs.cli_version }}' \
            --oidc-audience "$RELEASE_CONTROL_OIDC_AUDIENCE" \
            --output-dir target/harness-e2e-contract/contracts >/dev/null
          printf 'matrix=%s\n' \
            "$(jq -c '.matrix' target/harness-e2e-contract/contracts/resolution.json)" >>"$GITHUB_OUTPUT"

      - name: Validate every materialized contract
        run: |
          set -euo pipefail
          for contract in target/harness-e2e-contract/contracts/*.json; do
            [[ "$(basename "$contract")" == resolution.json ]] && continue
            python3 scripts/exact_stack_campaign.py validate --contract "$contract" >/dev/null
          done

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-contract-${{ inputs.execution_id }}-gh-${{ github.run_attempt }}
          path: target/harness-e2e-contract/
          retention-days: 1
          if-no-files-found: error

  groups:
    name: ${{ matrix.campaign_id }} · ${{ matrix.group_id }}
    needs: prepare
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 240
    environment: harness-e2e-trusted
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      HARNESS_E2E_ARTIFACTS_DIR: ${{ github.workspace }}/target/harness-e2e-exact-stack
      HARNESS_E2E_CAMPAIGN_GROUP_ID: ${{ matrix.group_id }}
      # Leave ten minutes for terminal polling, capture, packaging and upload.
      HARNESS_E2E_SUITE_DEADLINE_SECONDS: 10200
      HARNESS_E2E_RUN_TIMEOUT_SECONDS: 10800
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.runner_sha }}
          persist-credentials: false

      - name: Mint private Registry source token
        id: registry_source_token
        if: startsWith(matrix.group_id, 'case-registry-')
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.III_CI_APP_ID }}
          private-key: ${{ secrets.III_CI_APP_PRIVATE_KEY }}
          owner: iii-hq
          repositories: |
            registry
            e2e-fixture
          permission-contents: read

      - name: Checkout pinned Registry source
        if: startsWith(matrix.group_id, 'case-registry-')
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: iii-hq/registry
          ref: 662eb87c1bdbb395f36264d5d26bf823e2ace783
          token: ${{ steps.registry_source_token.outputs.token }}
          persist-credentials: false
          path: .registry-sources/registry

      - name: Checkout latest E2E fixture
        if: startsWith(matrix.group_id, 'case-registry-')
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: iii-hq/e2e-fixture
          token: ${{ steps.registry_source_token.outputs.token }}
          persist-credentials: false
          path: .registry-sources/e2e-fixture

      - name: Route Registry fixture clones to prepared sources
        if: startsWith(matrix.group_id, 'case-registry-')
        run: |
          set -euo pipefail
          test "$(git -C .registry-sources/registry rev-parse HEAD)" = 662eb87c1bdbb395f36264d5d26bf823e2ace783
          git config --global url."file://${GITHUB_WORKSPACE}/.registry-sources/registry".insteadOf https://github.com/iii-hq/registry.git
          git config --global url."file://${GITHUB_WORKSPACE}/.registry-sources/e2e-fixture".insteadOf https://github.com/iii-hq/e2e-fixture.git

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: e2e-contract-${{ inputs.execution_id }}-gh-${{ github.run_attempt }}
          path: target/harness-e2e-contract

      - name: Restore this campaign's contract
        id: contract
        run: |
          set -euo pipefail
          mkdir -p target/harness-e2e-exact-stack
          contract=target/harness-e2e-contract/contracts/${{ matrix.campaign_id }}.json
          cp "$contract" target/harness-e2e-exact-stack/stack-lock.json
          # The digest travels with every run as the instrument's identity, so
          # it is the executor's canonical one, never a shell approximation.
          printf 'sha256=%s\n' \
            "$(python3 scripts/exact_stack_campaign.py digest --contract "$contract")" >>"$GITHUB_OUTPUT"
          printf 'stack_lock<<CONTRACT\n%s\nCONTRACT\n' "$(cat "$contract")" >>"$GITHUB_ENV"

      - name: Checkout pinned Kanban fixture
        if: startsWith(matrix.group_id, 'case-kanban-')
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: iii-hq/kanban-e2e-fixture
          ref: 0471257a95095da7c5e9d366e26636976472e90d
          path: target/kanban-fixture
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: startsWith(matrix.group_id, 'case-kanban-')
        with:
          node-version: 24.18.0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.97.1
        if: matrix.execution_kind == 'fault_injection'
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: matrix.execution_kind == 'fault_injection'
        with:
          workspaces: .
          key: harness-e2e-fault-${{ needs.prepare.outputs.runner_revision }}

      - name: Build exact fault evaluator
        if: matrix.execution_kind == 'fault_injection'
        run: cargo build --locked --release --bin harness-e2e

      - name: Install iii project scaffold tooling
        run: python3 -m pip install --quiet pyyaml

      - name: Install SWE execution isolation
        if: startsWith(matrix.group_id, 'case-swe-')
        run: scripts/install_bwrap.sh

      - name: Execute common campaign group
        id: common
        if: matrix.execution_kind != 'fault_injection'
        continue-on-error: true
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HARNESS_E2E_STACK_LOCK: ${{ env.stack_lock }}
        run: scripts/run_exact_stack_group.sh

      - name: Execute protected fault campaign group
        id: fault
        if: matrix.execution_kind == 'fault_injection'
        continue-on-error: true
        env:
          HARNESS_E2E_STACK_LOCK: ${{ env.stack_lock }}
          HARNESS_E2E_HARNESS_ROOT: ${{ github.workspace }}
        run: scripts/run_exact_stack_fault.sh

      - name: Publish SWE journey handoff
        if: always() && matrix.execution_kind != 'fault_injection'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.E2E_FIXTURE_GITHUB_TOKEN }}
          SWE_EXECUTION_ID: ${{ inputs.execution_id }}-${{ matrix.campaign_id }}-${{ matrix.group_id }}
          SWE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/publish_swe_campaign.py \
            --reports-dir target/harness-e2e-exact-stack/deliverables \
            --execution-id "$SWE_EXECUTION_ID" --run-url "$SWE_RUN_URL" \
            --output target/harness-e2e-exact-stack/swe-publication.json

      # Whatever the group did, its runs reach the ledger: from results.json
      # when the group finished, from the journal checkpoints when it did not,
      # and as an empty shard saying so when it produced neither.
      - name: Report this shard's runs
        if: always()
        env:
          RELEASE_CONTROL_API_URL: ${{ vars.RELEASE_CONTROL_API_URL }}
          RELEASE_CONTROL_OIDC_AUDIENCE: ${{ vars.RELEASE_CONTROL_OIDC_AUDIENCE || 'release-control-harness-e2e' }}
        run: |
          python3 scripts/report_execution.py shard \
            --execution-id '${{ inputs.execution_id }}' \
            --oidc-audience "$RELEASE_CONTROL_OIDC_AUDIENCE" \
            --campaign-id '${{ matrix.campaign_id }}' \
            --group-id '${{ matrix.group_id }}' \
            --outcome '${{ steps.common.outcome || steps.fault.outcome }}' \
            --artifacts target/harness-e2e-exact-stack \
            --profile-snapshot target/harness-e2e-contract/profile.json \
            --plan target/harness-e2e-contract/plan.json \
            --resolution target/harness-e2e-contract/contracts/resolution.json \
            --contract-sha256 '${{ steps.contract.outputs.sha256 }}' \
            --runner-sha '${{ inputs.runner_sha }}' \
            --cli-version '${{ inputs.cli_version }}'

      - name: Package factual group evidence
        id: group_package
        if: always()
        env:
          WORKFLOW_IDENTITY: >-
            {"repository":"${{ github.repository }}","workflow":"exact-stack-e2e.yml","workflow_sha":"${{ github.sha }}","run_id":${{ github.run_id }},"run_attempt":${{ github.run_attempt }},"group_id":"${{ matrix.group_id }}","job":"${{ github.job }}"}
        run: |
          set -euo pipefail
          python3 scripts/exact_stack_campaign.py package \
            --root target/harness-e2e-exact-stack \
            --contract target/harness-e2e-exact-stack/stack-lock.json \
            --workflow "$WORKFLOW_IDENTITY" \
            --output target/harness-e2e-exact-stack/bundle-manifest.json

      - name: Preserve safe group packaging diagnostic
        id: group_package_failure
        if: always() && steps.group_package.outcome == 'failure'
        run: |
          set -euo pipefail
          diagnostic_dir=$(mktemp -d "${RUNNER_TEMP:?}/harness-e2e-package-failure.XXXXXX")
          printf '%s\n' '{"phase":"artifact_packaging","outcome":"infra_failed","error":"Group artifact validation failed; unsafe tree was not uploaded. See workflow logs."}' > "$diagnostic_dir/failure.json"
          printf 'path=%s\n' "$diagnostic_dir" >> "$GITHUB_OUTPUT"

      - name: Upload group observation bundle
        if: always() && (steps.group_package.outcome == 'success' || steps.group_package_failure.outcome == 'success')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-observation-${{ inputs.execution_id }}-${{ matrix.campaign_id }}-${{ matrix.group_id }}-gh-${{ github.run_attempt }}
          path: ${{ steps.group_package.outcome == 'success' && 'target/harness-e2e-exact-stack/' || steps.group_package_failure.outputs.path }}
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

      - name: Preserve factual group conclusion
        if: always() && (steps.common.outcome == 'failure' || steps.fault.outcome == 'failure' || steps.group_package.outcome == 'failure')
        run: exit 1

  finalize:
    name: Aggregate and report the campaign
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, groups]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: harness-e2e-trusted
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.runner_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: e2e-contract-${{ inputs.execution_id }}-gh-${{ github.run_attempt }}
          path: target/harness-e2e-contract

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        id: group_download
        continue-on-error: true
        with:
          pattern: e2e-observation-${{ inputs.execution_id }}-*-gh-${{ github.run_attempt }}
          path: target/downloaded-groups
          merge-multiple: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.97.1
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Restore deterministic group paths
        if: always()
        run: |
          set -euo pipefail
          rm -rf target/harness-e2e-campaign
          while IFS= read -r contract; do
            campaign=$(basename "$contract" .json)
            root="target/harness-e2e-campaign/$campaign"
            mkdir -p "$root/groups"
            cp "$contract" "$root/stack-lock.json"
            while IFS= read -r group; do
              source="target/downloaded-groups/e2e-observation-${{ inputs.execution_id }}-${campaign}-${group}-gh-${{ github.run_attempt }}"
              destination="$root/groups/$group"
              if [[ -d "$source" ]]; then
                mv "$source" "$destination"
              else
                mkdir -p "$destination"
                jq -n --arg group_id "$group" --arg campaign_id "$campaign" \
                  '{phase:"workflow_artifact_download",outcome:"infra_failed",campaign_id:$campaign_id,group_id:$group_id,error:"group observation artifact was not available"}' \
                  >"$destination/failure.json"
              fi
            done < <(python3 scripts/exact_stack_campaign.py groups --contract "$contract")
          done < <(find target/harness-e2e-contract/contracts -name '*.json' ! -name resolution.json | sort)

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.13.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Build exact campaign catalog
        run: cargo build --locked --bin harness-e2e

      - name: Aggregate with exact Harness scoring implementation
        id: aggregate
        continue-on-error: true
        run: |
          set -euo pipefail
          for root in target/harness-e2e-campaign/*/; do
            python3 scripts/exact_stack_campaign.py manifest \
              --contract "$root/stack-lock.json" \
              --output "$root/campaign-manifest.json"
            python3 scripts/run_e2e_campaign.py \
              "$root/campaign-manifest.json" \
              --e2e-bin "$PWD/target/debug/harness-e2e" \
              --aggregate-existing-root "$root/groups" \
              --execution-id '${{ inputs.execution_id }}' \
              --summary "$root/campaign-summary.json" \
              --bundle "$root/campaign-bundle.json"
          done
          jq -s '{campaigns: .}' target/harness-e2e-campaign/*/campaign-summary.json \
            >target/harness-e2e-campaign/execution-summary.json

      - name: Report the campaign summary
        if: always()
        env:
          RELEASE_CONTROL_API_URL: ${{ vars.RELEASE_CONTROL_API_URL }}
          RELEASE_CONTROL_OIDC_AUDIENCE: ${{ vars.RELEASE_CONTROL_OIDC_AUDIENCE || 'release-control-harness-e2e' }}
        run: |
          set -euo pipefail
          test -f target/harness-e2e-campaign/execution-summary.json \
            || jq -n '{campaigns:[],unavailable:"the finalizer produced no summary"}' \
                 >target/harness-e2e-campaign/execution-summary.json
          python3 scripts/report_execution.py summary \
            --execution-id '${{ inputs.execution_id }}' \
            --oidc-audience "$RELEASE_CONTROL_OIDC_AUDIENCE" \
            --summary target/harness-e2e-campaign/execution-summary.json \
            --plan target/harness-e2e-contract/plan.json \
            --profile-snapshot target/harness-e2e-contract/profile.json \
            --resolution target/harness-e2e-contract/contracts/resolution.json \
            --runner-sha '${{ inputs.runner_sha }}' \
            --cli-version '${{ inputs.cli_version }}'

      - name: Package factual root evidence
        id: root_package
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          for root in target/harness-e2e-campaign/*/; do
            python3 scripts/exact_stack_campaign.py package \
              --root "$root" \
              --contract "$root/stack-lock.json" \
              --workflow '{"repository":"${{ github.repository }}","workflow":"exact-stack-e2e.yml","workflow_sha":"${{ github.sha }}","run_id":${{ github.run_id }},"run_attempt":${{ github.run_attempt }},"job":"finalize"}' \
              --output "$root/bundle-manifest.json"
          done

      - name: Preserve safe root packaging diagnostic
        id: root_package_failure
        if: always() && steps.root_package.outcome == 'failure'
        run: |
          set -euo pipefail
          diagnostic_dir=$(mktemp -d "${RUNNER_TEMP:?}/harness-e2e-package-failure.XXXXXX")
          printf '%s\n' '{"phase":"artifact_packaging","outcome":"infra_failed","error":"Root artifact validation failed; unsafe tree was not uploaded. See workflow logs."}' > "$diagnostic_dir/failure.json"
          printf 'path=%s\n' "$diagnostic_dir" >> "$GITHUB_OUTPUT"

      - name: Upload root observation bundle
        id: root_upload
        if: always() && (steps.root_package.outcome == 'success' || steps.root_package_failure.outcome == 'success')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-observation-${{ inputs.execution_id }}-gh-${{ github.run_attempt }}
          path: ${{ steps.root_package.outcome == 'success' && 'target/harness-e2e-campaign/' || steps.root_package_failure.outputs.path }}
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

      - name: Preserve factual finalizer conclusion
        if: always() && (steps.aggregate.outcome == 'failure' || steps.root_package.outcome == 'failure' || steps.root_upload.outcome == 'failure')
        run: exit 1

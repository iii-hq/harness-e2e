name: Execute exact-stack Harness E2E campaign
run-name: ${{ inputs.execution_id && format('E2E · {0}', inputs.execution_id) || format('E2E run · {0} · {1}', startsWith(inputs.suite, '{') && 'custom suite' || inputs.suite, inputs.model) }}

# A dispatch names what to test (a suite of config/test-plan.json), where (a
# stack of stacks/), with whom (a provider/model and optionally an agent
# profile) and, when Release Control sent it, the execution the reports go to.
# Everything else is resolved here, once, from the dispatched ref: the suite's
# groups, the iii release `latest` means today, and the stack Compose assembles
# and locks, which every group then starts frozen.
#
# Release Control's older inputs (plan, stack policy, runner_sha, cli_version)
# still work: preparation translates them into the ones above first.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite id from config/test-plan.json, or one suite as JSON (JSON needs a harness-e2e runner newer than 0.12.3)
        required: false
        type: string
      stack:
        description: Stack name in stacks/ or stack YAML (default); older dispatches send a stack policy JSON
        required: false
        type: string
      model:
        description: provider/model the subject runs
        required: false
        type: string
      profile:
        description: Directory agent profile the subject runs as (optional)
        required: false
        type: string
      execution_id:
        description: Release Control execution UUID; without one the run only produces artifacts
        required: false
        type: string
      plan:
        description: Older Release Control dispatch — the test plan JSON
        required: false
        type: string
      runner_sha:
        description: Older Release Control dispatch — executor commit it resolved
        required: false
        type: string
      cli_version:
        description: Older Release Control dispatch — iii CLI release
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

env:
  # Names the execution's artifacts and contracts: Release Control's id when it
  # dispatched the run, this run's id otherwise.
  EXECUTION_KEY: ${{ inputs.execution_id || github.run_id }}

concurrency:
  group: harness-e2e-exact-stack-${{ inputs.execution_id || github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Materialize the suite and assemble the stack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: harness-e2e-trusted
    outputs:
      matrix: ${{ steps.contracts.outputs.matrix }}
      runner_revision: ${{ steps.stack_runner.outputs.revision }}
      materialized: ${{ steps.materialized.outputs.posted }}
      contract_artifact_id: ${{ steps.contract_upload.outputs.artifact-id }}
      contract_attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Identity: an execution that reports to Release Control comes from its
      # bot and names itself as it does.
      - name: Validate a Release Control dispatch
        if: inputs.execution_id != ''
        env:
          RELEASE_CONTROL_BOT_LOGIN: ${{ vars.RELEASE_CONTROL_BOT_LOGIN }}
          EXECUTION_ID: ${{ inputs.execution_id }}
          RUNNER_SHA: ${{ inputs.runner_sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_CONTROL_BOT_LOGIN"
          test "$GITHUB_ACTOR" = "$RELEASE_CONTROL_BOT_LOGIN"
          test "$GITHUB_TRIGGERING_ACTOR" = "$RELEASE_CONTROL_BOT_LOGIN"
          [[ "$EXECUTION_ID" =~ ^[0-9a-f-]{36}$ ]]
          [[ -z "$RUNNER_SHA" || "$RUNNER_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Install stack tooling
        run: python3 -m pip install --quiet pyyaml

      - name: Read the dispatch
        env:
          DISPATCH_SUITE: ${{ inputs.suite }}
          DISPATCH_STACK: ${{ inputs.stack }}
          DISPATCH_MODEL: ${{ inputs.model }}
          DISPATCH_PROFILE: ${{ inputs.profile }}
          DISPATCH_EXECUTION_ID: ${{ inputs.execution_id }}
          DISPATCH_PLAN: ${{ inputs.plan }}
          DISPATCH_RUNNER_SHA: ${{ inputs.runner_sha }}
          DISPATCH_CLI_VERSION: ${{ inputs.cli_version }}
        run: python3 scripts/prepare_execution.py dispatch --contract-dir target/harness-e2e-contract

      - name: Resolve the iii release and the template
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_execution.py runtime --contract-dir target/harness-e2e-contract

      # The suite is materialized by the runner the stack runs, never by a
      # build of this checkout: its master plan and scenario catalog are the
      # ones every group executes. Its exact release is pinned in the stack.
      # The reports name it by the commit Release Control resolved for an
      # older dispatch, else by the revision the runner reports.
      - name: Fetch the stack's runner
        id: stack_runner
        run: |
          set -euo pipefail
          contract=target/harness-e2e-contract
          binary=$(python3 scripts/prepare_execution.py runner --contract-dir "$contract" --work-dir "$RUNNER_TEMP/harness-e2e-runner")
          printf 'binary=%s\n' "$binary" >>"$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$(jq -r '.runner_revision' "$contract/execution.json")" >>"$GITHUB_OUTPUT"

      # suite.json is the snapshot; profile.json is the same file under the
      # name older Console imports and the ledger reports read. `--profile`
      # is the flag every runner release knows.
      - name: Materialize the requested suite
        env:
          RUNNER_BINARY: ${{ steps.stack_runner.outputs.binary }}
        run: |
          set -euo pipefail
          contract=target/harness-e2e-contract
          suite=$(jq -r '.suite | if type == "string" then . else tojson end' "$contract/execution.json")
          "$RUNNER_BINARY" test-plan materialize --profile "$suite" >"$contract/suite.json"
          jq -e '.campaigns | length > 0' "$contract/suite.json" >/dev/null
          cp "$contract/suite.json" "$contract/profile.json"

      # Posted before anything runs and before the stack is assembled: this is
      # what tells Release Control which shards to expect, so a campaign that
      # dies during assembly is still a campaign it knows the shape of.
      - name: Report the materialized suite
        id: materialized
        if: inputs.execution_id != ''
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
          RUNNER_REVISION: ${{ steps.stack_runner.outputs.revision }}
          RELEASE_CONTROL_API_URL: ${{ vars.RELEASE_CONTROL_API_URL }}
          RELEASE_CONTROL_OIDC_AUDIENCE: ${{ vars.RELEASE_CONTROL_OIDC_AUDIENCE || 'release-control-harness-e2e' }}
        run: |
          python3 scripts/report_execution.py materialized \
            --execution-id "$EXECUTION_ID" \
            --oidc-audience "$RELEASE_CONTROL_OIDC_AUDIENCE" \
            --profile-snapshot target/harness-e2e-contract/profile.json \
            --plan target/harness-e2e-contract/plan.json \
            --runner-sha "$RUNNER_REVISION" \
            --cli-version "$(jq -r '.iii' target/harness-e2e-contract/execution.json)"
          echo "posted=true" >>"$GITHUB_OUTPUT"

      - name: Write one contract per campaign
        env:
          RELEASE_CONTROL_OIDC_AUDIENCE: ${{ vars.RELEASE_CONTROL_OIDC_AUDIENCE || 'release-control-harness-e2e' }}
        run: |
          python3 scripts/prepare_execution.py contracts \
            --contract-dir target/harness-e2e-contract \
            --execution-key "$EXECUTION_KEY" \
            --oidc-audience "$RELEASE_CONTROL_OIDC_AUDIENCE"

      # Once for the whole execution: compose::add expands every declared
      # worker into its graph and writes worker-compose.lock. The groups start
      # exactly that project, frozen, so they all run the same versions. It
      # gets the credentials the groups get, and one more try before the
      # execution fails.
      - name: Assemble and lock the stack
        id: assemble
        env:
          HARNESS_E2E_ASSEMBLE_ONLY: "1"
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -euo pipefail
          contracts=target/harness-e2e-contract/contracts
          HARNESS_E2E_CONTRACT="$contracts/$(jq -r '.campaign_ids[0]' "$contracts/resolution.json").json"
          HARNESS_E2E_CAMPAIGN_GROUP_ID=$(jq -r '.matrix.include[0].group_id' "$contracts/resolution.json")
          export HARNESS_E2E_CONTRACT HARNESS_E2E_CAMPAIGN_GROUP_ID
          for attempt in 1 2; do
            export HARNESS_E2E_ARTIFACTS_DIR="$GITHUB_WORKSPACE/target/harness-e2e-assembly/attempt-$attempt"
            if scripts/run_exact_stack_group.sh; then
              printf 'stack=%s\n' "$HARNESS_E2E_ARTIFACTS_DIR/stack" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::stack assembly attempt $attempt failed"
          done
          exit 1

      - name: Lock every contract to the assembled stack
        id: contracts
        env:
          ASSEMBLED: ${{ steps.assemble.outputs.stack }}
        run: |
          set -euo pipefail
          python3 scripts/prepare_execution.py lock \
            --contract-dir target/harness-e2e-contract \
            --assembled "$ASSEMBLED"
          summary=target/harness-e2e-contract/contracts/resolution.json
          # A missing or empty matrix means no shard runs and every later job is
          # skipped. Say so here rather than let it surface as a glob that
          # matched nothing three steps downstream.
          jq -e '.matrix.include | length > 0' "$summary" >/dev/null
          printf 'matrix=%s\n' "$(jq -c '.matrix' "$summary")" >>"$GITHUB_OUTPUT"

      - name: Validate every materialized contract
        run: |
          set -euo pipefail
          for contract in target/harness-e2e-contract/contracts/*.json; do
            [[ "$(basename "$contract")" == resolution.json ]] && continue
            python3 scripts/exact_stack_campaign.py validate --contract "$contract" >/dev/null
          done

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: contract_upload
        with:
          name: e2e-contract-${{ env.EXECUTION_KEY }}-gh-${{ github.run_attempt }}
          path: target/harness-e2e-contract/
          retention-days: 90
          if-no-files-found: error

      # The assembly ran with provider credentials: its evidence goes through
      # the same checks a group's does before it is uploaded.
      - name: Package the stack assembly evidence
        id: assembly_package
        if: always() && steps.assemble.outcome != 'skipped'
        # Evidence is best effort: it never fails a prepared execution.
        continue-on-error: true
        run: |
          set -euo pipefail
          for root in target/harness-e2e-assembly/attempt-*/; do
            python3 scripts/exact_stack_campaign.py package \
              --root "$root" \
              --contract "$root/stack-lock.json" \
              --workflow '{"workflow":"exact-stack-e2e.yml","job":"prepare","step":"assemble"}' \
              --output "$root/bundle-manifest.json"
          done

      - name: Upload the stack assembly evidence
        if: always() && steps.assembly_package.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-assembly-${{ env.EXECUTION_KEY }}-gh-${{ github.run_attempt }}
          path: target/harness-e2e-assembly/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: ignore

  groups:
    name: ${{ matrix.campaign_id }} · ${{ matrix.group_id }}
    needs: prepare
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 240
    environment: harness-e2e-trusted
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      HARNESS_E2E_ARTIFACTS_DIR: ${{ github.workspace }}/target/harness-e2e-exact-stack
      HARNESS_E2E_CAMPAIGN_GROUP_ID: ${{ matrix.group_id }}
      # Leave ten minutes for terminal polling, capture, packaging and upload.
      HARNESS_E2E_SUITE_DEADLINE_SECONDS: 10200
      HARNESS_E2E_RUN_TIMEOUT_SECONDS: 10800
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Mint private Registry source token
        id: registry_source_token
        if: startsWith(matrix.group_id, 'case-registry-')
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.III_CI_APP_ID }}
          private-key: ${{ secrets.III_CI_APP_PRIVATE_KEY }}
          owner: iii-hq
          repositories: |
            registry
            e2e-fixture
          permission-contents: read

      - name: Checkout pinned Registry source
        if: startsWith(matrix.group_id, 'case-registry-')
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: iii-hq/registry
          ref: 662eb87c1bdbb395f36264d5d26bf823e2ace783
          token: ${{ steps.registry_source_token.outputs.token }}
          persist-credentials: false
          path: .registry-sources/registry

      - name: Checkout latest E2E fixture
        if: startsWith(matrix.group_id, 'case-registry-')
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: iii-hq/e2e-fixture
          token: ${{ steps.registry_source_token.outputs.token }}
          persist-credentials: false
          path: .registry-sources/e2e-fixture

      - name: Route Registry fixture clones to prepared sources
        if: startsWith(matrix.group_id, 'case-registry-')
        run: |
          set -euo pipefail
          test "$(git -C .registry-sources/registry rev-parse HEAD)" = 662eb87c1bdbb395f36264d5d26bf823e2ace783
          git config --global url."file://${GITHUB_WORKSPACE}/.registry-sources/registry".insteadOf https://github.com/iii-hq/registry.git
          git config --global url."file://${GITHUB_WORKSPACE}/.registry-sources/e2e-fixture".insteadOf https://github.com/iii-hq/e2e-fixture.git

      - name: Mint private trending topics fixture token
        id: trending_fixture_token
        if: matrix.group_id == 'case-trending-topics-build'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.III_CI_APP_ID }}
          private-key: ${{ secrets.III_CI_APP_PRIVATE_KEY }}
          owner: iii-hq
          repositories: e2e-fixture
          permission-contents: read

      - name: Checkout pinned trending topics fixture
        if: matrix.group_id == 'case-trending-topics-build'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: iii-hq/e2e-fixture
          ref: 3ee24f7ace3c014db35423f14939ad3f6ce0c3d2
          token: ${{ steps.trending_fixture_token.outputs.token }}
          persist-credentials: false
          path: .trending-topics-fixture

      - name: Route trending topics fixture fetch to the pinned checkout
        if: matrix.group_id == 'case-trending-topics-build'
        run: |
          set -euo pipefail
          test "$(git -C .trending-topics-fixture rev-parse HEAD)" = 3ee24f7ace3c014db35423f14939ad3f6ce0c3d2
          git config --global url."file://${GITHUB_WORKSPACE}/.trending-topics-fixture".insteadOf git@github.com:iii-hq/e2e-fixture.git

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.prepare.outputs.contract_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: target/harness-e2e-contract

      - name: Restore this campaign's contract
        id: contract
        run: |
          set -euo pipefail
          mkdir -p target/harness-e2e-exact-stack
          contract=target/harness-e2e-contract/contracts/${{ matrix.campaign_id }}.json
          cp "$contract" target/harness-e2e-exact-stack/stack-lock.json
          # The stack a run measured is the lock every group started from: the
          # same versions give the same digest, whatever execution ran them.
          printf 'lock_sha256=sha256:%s\n' \
            "$(sha256sum target/harness-e2e-contract/worker-compose.lock | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      - name: Checkout Kanban fixture
        if: startsWith(matrix.group_id, 'case-kanban-')
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: iii-hq/kanban-e2e-fixture
          ref: main
          path: target/kanban-fixture
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned Linkly template
        if: matrix.group_id == 'case-linkly-tutorial'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: iii-hq/templates
          ref: ba1dfd95d4f4120705c8b0cc95d9a2ef86a0290d
          path: target/linkly-templates
          persist-credentials: false

      - name: Checkout the stack's template
        if: matrix.template_revision != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: iii-hq/templates
          ref: ${{ matrix.template_revision }}
          path: target/execution-template
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: matrix.template_revision != '' || startsWith(matrix.group_id, 'case-kanban-') || matrix.group_id == 'case-linkly-tutorial'
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        if: matrix.template_revision != ''
        with:
          version: 11.13.1

      # Workers run on this runner, so the subject's shell and the scenario
      # runner share its PATH. alertmanager_route_match builds Go 1.25 code.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false

      - name: Install iii project scaffold tooling
        run: python3 -m pip install --quiet pyyaml

      - name: Execute common campaign group
        id: common
        continue-on-error: true
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          HARNESS_E2E_CONTRACT: target/harness-e2e-contract/contracts/${{ matrix.campaign_id }}.json
        run: scripts/run_exact_stack_group.sh

      # Whatever the group did, its runs reach the ledger: from results.json
      # when the group finished, from the journal checkpoints when it did not,
      # and as an empty shard saying so when it produced neither.
      - name: Report this shard's runs
        if: always() && inputs.execution_id != ''
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
          RUNNER_REVISION: ${{ needs.prepare.outputs.runner_revision }}
          RELEASE_CONTROL_API_URL: ${{ vars.RELEASE_CONTROL_API_URL }}
          RELEASE_CONTROL_OIDC_AUDIENCE: ${{ vars.RELEASE_CONTROL_OIDC_AUDIENCE || 'release-control-harness-e2e' }}
        run: |
          python3 scripts/report_execution.py shard \
            --execution-id "$EXECUTION_ID" \
            --artifact-name "e2e-observation-$EXECUTION_KEY-${{ matrix.campaign_id }}-${{ matrix.group_id }}-gh-${{ github.run_attempt }}" \
            --oidc-audience "$RELEASE_CONTROL_OIDC_AUDIENCE" \
            --campaign-id '${{ matrix.campaign_id }}' \
            --group-id '${{ matrix.group_id }}' \
            --outcome '${{ steps.common.outcome }}' \
            --artifacts target/harness-e2e-exact-stack \
            --profile-snapshot target/harness-e2e-contract/profile.json \
            --plan target/harness-e2e-contract/plan.json \
            --resolution target/harness-e2e-contract/contracts/resolution.json \
            --stack-lock-sha256 '${{ steps.contract.outputs.lock_sha256 }}' \
            --runner-sha "$RUNNER_REVISION"

      - name: Package factual group evidence
        id: group_package
        if: always()
        env:
          WORKFLOW_IDENTITY: >-
            {"repository":"${{ github.repository }}","workflow":"exact-stack-e2e.yml","workflow_sha":"${{ github.sha }}","run_id":${{ github.run_id }},"run_attempt":${{ github.run_attempt }},"group_id":"${{ matrix.group_id }}","job":"${{ github.job }}"}
        run: |
          set -euo pipefail
          python3 scripts/exact_stack_campaign.py package \
            --root target/harness-e2e-exact-stack \
            --contract target/harness-e2e-exact-stack/stack-lock.json \
            --workflow "$WORKFLOW_IDENTITY" \
            --output target/harness-e2e-exact-stack/bundle-manifest.json

      - name: Preserve safe group packaging diagnostic
        id: group_package_failure
        if: always() && steps.group_package.outcome == 'failure'
        run: |
          set -euo pipefail
          diagnostic_dir=$(mktemp -d "${RUNNER_TEMP:?}/harness-e2e-package-failure.XXXXXX")
          printf '%s\n' '{"phase":"artifact_packaging","outcome":"infra_failed","error":"Group artifact validation failed; unsafe tree was not uploaded. See workflow logs."}' > "$diagnostic_dir/failure.json"
          printf 'path=%s\n' "$diagnostic_dir" >> "$GITHUB_OUTPUT"

      - name: Upload group observation bundle
        if: always() && (steps.group_package.outcome == 'success' || steps.group_package_failure.outcome == 'success')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-observation-${{ env.EXECUTION_KEY }}-${{ matrix.campaign_id }}-${{ matrix.group_id }}-gh-${{ github.run_attempt }}
          path: ${{ steps.group_package.outcome == 'success' && 'target/harness-e2e-exact-stack/' || steps.group_package_failure.outputs.path }}
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

      - name: Preserve factual group conclusion
        if: always() && (steps.common.outcome == 'failure' || steps.group_package.outcome == 'failure')
        run: exit 1

  finalize:
    name: Aggregate and report the campaign
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, groups]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: harness-e2e-trusted
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.prepare.outputs.contract_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: target/harness-e2e-contract

      - name: Select group observation artifacts
        id: group_artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACT_ATTEMPT: ${{ needs.prepare.outputs.contract_attempt }}
        run: |
          set -euo pipefail
          rm -rf target/downloaded-groups
          mkdir -p target
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            >target/group-jobs.json
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            >target/group-artifacts.json
          python3 - <<'PY'
          import json
          import os
          import re
          from collections import Counter
          from datetime import datetime
          from pathlib import Path

          jobs = [job for page in json.loads(Path("target/group-jobs.json").read_text()) for job in page["jobs"]]
          artifacts = [artifact for page in json.loads(Path("target/group-artifacts.json").read_text()) for artifact in page["artifacts"]]
          first_attempt = int(os.environ["CONTRACT_ATTEMPT"])
          current_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          names = Counter(job["name"] for job in jobs)
          selected = {}
          for job in jobs:
              if job["status"] != "completed" or names[job["name"]] != 1 or " · " not in job["name"]:
                  continue
              campaign, group = job["name"].split(" · ", 1)
              prefix = f"e2e-observation-{os.environ['EXECUTION_KEY']}-{campaign}-{group}-gh-"
              try:
                  started = datetime.fromisoformat(job["started_at"].replace("Z", "+00:00"))
                  completed = datetime.fromisoformat(job["completed_at"].replace("Z", "+00:00"))
              except (AttributeError, TypeError, ValueError):
                  continue
              if started.tzinfo is None or completed.tzinfo is None or started > completed:
                  continue
              matches = []
              for artifact in artifacts:
                  match = re.fullmatch(re.escape(prefix) + r"([1-9][0-9]*)", artifact["name"])
                  if not match or artifact["expired"] or not first_attempt <= int(match[1]) <= current_attempt:
                      continue
                  try:
                      created = datetime.fromisoformat(artifact["created_at"].replace("Z", "+00:00"))
                  except (AttributeError, TypeError, ValueError):
                      continue
                  # Partial reruns copy successful jobs with new IDs/attempts
                  # but retain their execution times. Never substitute older
                  # evidence for a rerun that failed to upload an artifact.
                  if created.tzinfo is not None and started <= created <= completed:
                      matches.append({"id": artifact["id"], "name": artifact["name"], "run_attempt": int(match[1])})
              if len(matches) == 1:
                  selected[job["name"]] = matches[0]
          Path("target/selected-group-artifacts.json").write_text(json.dumps(selected, indent=2) + "\n")
          download_path = "target/downloaded-groups"
          if len(selected) == 1:
              # download-artifact flattens a singleton, even with merge-multiple:false.
              download_path += "/" + next(iter(selected.values()))["name"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("artifact_ids=" + ",".join(str(item["id"]) for item in selected.values()) + "\n")
              output.write(f"download_path={download_path}\n")
          PY

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        id: group_download
        if: steps.group_artifacts.outcome == 'success' && steps.group_artifacts.outputs.artifact_ids != ''
        continue-on-error: true
        with:
          artifact-ids: ${{ steps.group_artifacts.outputs.artifact_ids }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ steps.group_artifacts.outputs.download_path }}
          merge-multiple: false

      # Aggregated by the runner the stack ran, as the suite was materialized
      # by it: one release scores what it executed.
      - name: Fetch the stack's runner
        id: stack_runner
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          printf 'binary=%s\n' "$(python3 scripts/prepare_execution.py runner-binary \
            --lock target/harness-e2e-contract/worker-compose.lock \
            --work-dir "$RUNNER_TEMP/harness-e2e-runner")" >>"$GITHUB_OUTPUT"

      - name: Restore deterministic group paths
        if: always()
        run: |
          set -euo pipefail
          rm -rf target/harness-e2e-campaign
          while IFS= read -r contract; do
            campaign=$(basename "$contract" .json)
            root="target/harness-e2e-campaign/$campaign"
            mkdir -p "$root/groups"
            cp "$contract" "$root/stack-lock.json"
            while IFS= read -r group; do
              artifact_name=""
              if [[ -f target/selected-group-artifacts.json ]]; then
                artifact_name=$(jq -r --arg job "$campaign · $group" '.[$job].name // empty' target/selected-group-artifacts.json)
              fi
              source="target/downloaded-groups/$artifact_name"
              destination="$root/groups/$group"
              if [[ -n "$artifact_name" && -d "$source" ]]; then
                mv "$source" "$destination"
              else
                mkdir -p "$destination"
                jq -n --arg group_id "$group" --arg campaign_id "$campaign" \
                  '{phase:"workflow_artifact_download",outcome:"infra_failed",campaign_id:$campaign_id,group_id:$group_id,error:"group observation artifact was not available"}' \
                  >"$destination/failure.json"
              fi
            done < <(python3 scripts/exact_stack_campaign.py groups --contract "$contract")
          done < <(find target/harness-e2e-contract/contracts -name '*.json' ! -name resolution.json | sort)

      - name: Aggregate with exact Harness scoring implementation
        id: aggregate
        continue-on-error: true
        env:
          RUNNER_BINARY: ${{ steps.stack_runner.outputs.binary }}
        run: |
          set -euo pipefail
          for root in target/harness-e2e-campaign/*/; do
            python3 scripts/exact_stack_campaign.py manifest \
              --contract "$root/stack-lock.json" \
              --output "$root/campaign-manifest.json"
            python3 scripts/run_e2e_campaign.py \
              "$root/campaign-manifest.json" \
              --e2e-bin "$RUNNER_BINARY" \
              --aggregate-existing-root "$root/groups" \
              --execution-id "$EXECUTION_KEY" \
              --summary "$root/campaign-summary.json" \
              --bundle "$root/campaign-bundle.json"
          done
          jq -s '{campaigns: .}' target/harness-e2e-campaign/*/campaign-summary.json \
            >target/harness-e2e-campaign/execution-summary.json

      - name: Report the campaign summary
        if: always() && inputs.execution_id != ''
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
          RUNNER_REVISION: ${{ needs.prepare.outputs.runner_revision }}
          RELEASE_CONTROL_API_URL: ${{ vars.RELEASE_CONTROL_API_URL }}
          RELEASE_CONTROL_OIDC_AUDIENCE: ${{ vars.RELEASE_CONTROL_OIDC_AUDIENCE || 'release-control-harness-e2e' }}
        run: |
          set -euo pipefail
          test -f target/harness-e2e-campaign/execution-summary.json \
            || jq -n '{campaigns:[],unavailable:"the finalizer produced no summary"}' \
                 >target/harness-e2e-campaign/execution-summary.json
          python3 scripts/report_execution.py summary \
            --execution-id "$EXECUTION_ID" \
            --artifact-name "e2e-observation-$EXECUTION_KEY-gh-${{ github.run_attempt }}" \
            --oidc-audience "$RELEASE_CONTROL_OIDC_AUDIENCE" \
            --summary target/harness-e2e-campaign/execution-summary.json \
            --plan target/harness-e2e-contract/plan.json \
            --profile-snapshot target/harness-e2e-contract/profile.json \
            --resolution target/harness-e2e-contract/contracts/resolution.json \
            --runner-sha "$RUNNER_REVISION"

      - name: Package factual root evidence
        id: root_package
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          for root in target/harness-e2e-campaign/*/; do
            python3 scripts/exact_stack_campaign.py package \
              --root "$root" \
              --contract "$root/stack-lock.json" \
              --workflow '{"repository":"${{ github.repository }}","workflow":"exact-stack-e2e.yml","workflow_sha":"${{ github.sha }}","run_id":${{ github.run_id }},"run_attempt":${{ github.run_attempt }},"job":"finalize"}' \
              --output "$root/bundle-manifest.json"
          done

      - name: Preserve safe root packaging diagnostic
        id: root_package_failure
        if: always() && steps.root_package.outcome == 'failure'
        run: |
          set -euo pipefail
          diagnostic_dir=$(mktemp -d "${RUNNER_TEMP:?}/harness-e2e-package-failure.XXXXXX")
          printf '%s\n' '{"phase":"artifact_packaging","outcome":"infra_failed","error":"Root artifact validation failed; unsafe tree was not uploaded. See workflow logs."}' > "$diagnostic_dir/failure.json"
          printf 'path=%s\n' "$diagnostic_dir" >> "$GITHUB_OUTPUT"

      - name: Upload root observation bundle
        id: root_upload
        if: always() && (steps.root_package.outcome == 'success' || steps.root_package_failure.outcome == 'success')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-observation-${{ env.EXECUTION_KEY }}-gh-${{ github.run_attempt }}
          path: ${{ steps.root_package.outcome == 'success' && 'target/harness-e2e-campaign/' || steps.root_package_failure.outputs.path }}
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

      - name: Preserve factual finalizer conclusion
        if: always() && (steps.aggregate.outcome == 'failure' || steps.root_package.outcome == 'failure' || steps.root_upload.outcome == 'failure')
        run: exit 1

  # Preparation can fail after Release Control was told which shards to expect
  # (assembling the stack runs in it). Without this, no shard or summary would
  # ever follow and the execution would stay open.
  report_preparation_failure:
    name: Report a preparation that failed
    needs: prepare
    if: always() && needs.prepare.result != 'success' && needs.prepare.outputs.materialized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: harness-e2e-trusted
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Report the campaign summary
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
          RUNNER_REVISION: ${{ needs.prepare.outputs.runner_revision }}
          RELEASE_CONTROL_API_URL: ${{ vars.RELEASE_CONTROL_API_URL }}
          RELEASE_CONTROL_OIDC_AUDIENCE: ${{ vars.RELEASE_CONTROL_OIDC_AUDIENCE || 'release-control-harness-e2e' }}
        run: |
          set -euo pipefail
          mkdir -p target/harness-e2e-campaign
          jq -n '{campaigns:[],unavailable:"preparation failed after the suite was materialized; no group ran",outcome:"infra_failed",phase:"prepare"}' \
            >target/harness-e2e-campaign/execution-summary.json
          python3 scripts/report_execution.py summary \
            --execution-id "$EXECUTION_ID" \
            --oidc-audience "$RELEASE_CONTROL_OIDC_AUDIENCE" \
            --summary target/harness-e2e-campaign/execution-summary.json \
            --runner-sha "$RUNNER_REVISION"

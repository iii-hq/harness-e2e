name: Promote harness-e2e to latest

run-name: Promote harness-e2e@${{ inputs.version }} to latest

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version to promote
        required: true
        type: string
      expected_next_version:
        description: Exact version currently expected on Registry next
        required: true
        type: string
      expected_latest_version:
        description: Exact current latest version, or none
        required: true
        type: string
      release_run_id:
        description: GitHub Actions run ID of the successful immutable release
        required: true
        type: string
      release_run_attempt:
        description: Exact attempt of the immutable release run
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: harness-e2e-promote-latest
  cancel-in-progress: false

jobs:
  promote:
    name: Promote exact Registry candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: workers-registry-next
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate pinned release identity
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EXPECTED_NEXT_VERSION: ${{ inputs.expected_next_version }}
          EXPECTED_LATEST_VERSION: ${{ inputs.expected_latest_version }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_RUN_ATTEMPT: ${{ inputs.release_run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-experimental)?$ ]]
          [[ "$EXPECTED_NEXT_VERSION" == "$VERSION" ]]
          if [[ "$EXPECTED_LATEST_VERSION" != 'none' ]]; then
            [[ "$EXPECTED_LATEST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-experimental)?$ ]]
          fi
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")
          [[ "$(jq -r '.status' <<<"$run_json")" == 'completed' ]]
          [[ "$(jq -r '.conclusion' <<<"$run_json")" == 'success' ]]
          [[ "$(jq -r '.run_attempt' <<<"$run_json")" == "$RELEASE_RUN_ATTEMPT" ]]
          [[ "$(jq -r '.event' <<<"$run_json")" == 'push' ]]
          [[ "$(jq -r '.path' <<<"$run_json")" == '.github/workflows/release.yml' ]]

          tag="harness-e2e/v${VERSION}"
          git fetch origin "+refs/tags/${tag}:refs/tags/${tag}"
          tag_sha=$(git rev-parse "${tag}^{commit}")
          [[ "$(jq -r '.head_sha' <<<"$run_json")" == "$tag_sha" ]]

          cargo_version=$(git show "$tag:Cargo.toml" | python3 -c '
          import sys
          import tomllib
          package = tomllib.loads(sys.stdin.read()).get("package", {})
          if package.get("name") != "harness-e2e":
              raise SystemExit("tag Cargo.toml has the wrong package")
          print(package.get("version", ""))
          ')
          [[ "$cargo_version" == "$VERSION" ]]

          release_json=$(gh release view "$tag" --json isDraft,isPrerelease,tagName,assets)
          [[ "$(jq -r '.tagName' <<<"$release_json")" == "$tag" ]]
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == 'false' ]]
          [[ "$(jq -r '.isPrerelease' <<<"$release_json")" == 'true' ]]
          binary_count=$(jq '[.assets[]?.name | select(startswith("harness-e2e-")) | select(endswith(".tar.gz") or endswith(".zip"))] | length' <<<"$release_json")
          checksum_count=$(jq '[.assets[]?.name | select(startswith("harness-e2e-")) | select(endswith(".sha256"))] | length' <<<"$release_json")
          [[ "$binary_count" -eq 9 ]]
          [[ "$checksum_count" -eq 9 ]]

          printf '%s\n' "$tag_sha" > tag-sha.txt
          echo "::notice::validated $tag at $tag_sha from release run $RELEASE_RUN_ID/$RELEASE_RUN_ATTEMPT"

      - name: Verify Registry candidate and CAS precondition
        env:
          API_URL: https://api.workers.iii.dev
          WORKER: harness-e2e
          VERSION: ${{ inputs.version }}
          EXPECTED_NEXT_VERSION: ${{ inputs.expected_next_version }}
          EXPECTED_LATEST_VERSION: ${{ inputs.expected_latest_version }}
        run: |
          set -euo pipefail
          python3 scripts/promote_registry.py verify \
            --api-url "$API_URL" \
            --worker "$WORKER" \
            --version "$VERSION" \
            --expected-next-version "$EXPECTED_NEXT_VERSION" \
            --expected-latest-version "$EXPECTED_LATEST_VERSION" \
            --output registry-state.json

      - name: Promote Registry latest with exact CAS
        env:
          WORKERS_REGISTRY_API_KEY: ${{ secrets.WORKERS_REGISTRY_API_KEY }}
          API_URL: https://api.workers.iii.dev
          WORKER: harness-e2e
          VERSION: ${{ inputs.version }}
          EXPECTED_NEXT_VERSION: ${{ inputs.expected_next_version }}
          EXPECTED_LATEST_VERSION: ${{ inputs.expected_latest_version }}
        run: |
          set -euo pipefail
          python3 scripts/promote_registry.py promote \
            --api-url "$API_URL" \
            --worker "$WORKER" \
            --version "$VERSION" \
            --expected-next-version "$EXPECTED_NEXT_VERSION" \
            --expected-latest-version "$EXPECTED_LATEST_VERSION" \
            --output registry-promotion.json

      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: harness-e2e-latest-promotion-${{ github.run_id }}
          path: |
            tag-sha.txt
            registry-state.json
            registry-promotion.json
          retention-days: 30
          if-no-files-found: ignore

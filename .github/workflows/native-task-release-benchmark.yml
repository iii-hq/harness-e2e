name: Native Harness release benchmark

on:
  repository_dispatch:
    types: [harness-release-published]
  workflow_dispatch:
    inputs:
      release_channel:
        description: Published channel (rc or stable)
        required: true
        type: choice
        options: [rc, stable]
      release_tag:
        description: Immutable Harness release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-task-release-${{ github.event.client_payload.release_tag || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: [self-hosted, harness-e2e]
    environment: harness-e2e-trusted
    timeout-minutes: 300
    env:
      HARNESS_E2E_MODEL: ${{ vars.HARNESS_E2E_MODEL }}
      HARNESS_E2E_PROVIDER: ${{ vars.HARNESS_E2E_PROVIDER }}
      III_URL: ${{ vars.III_URL }}
      RELEASE_CHANNEL: ${{ github.event.client_payload.release_channel || inputs.release_channel }}
      RELEASE_TAG: ${{ github.event.client_payload.release_tag || inputs.release_tag }}
      COMPONENTS_JSON: ${{ toJson(github.event.client_payload.components) }}
      OFFICIAL_VERIFIER_B64: ${{ secrets.HARNESS_E2E_OFFICIAL_VERIFIER_BUNDLE }}
      HARNESS_E2E_TASK_FIXTURE_PATH: ${{ github.workspace }}/target/fixtures/native-task-fixtures
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Require native task fixture access
        env:
          E2E_FIXTURE_GITHUB_TOKEN: ${{ secrets.E2E_FIXTURE_GITHUB_TOKEN }}
        run: test -n "$E2E_FIXTURE_GITHUB_TOKEN"
      - name: Checkout pinned native task fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: iii-hq/e2e-fixture
          ref: 5e9bf8fd77bafc42ad7d62b99b3b84f1b1d35029
          token: ${{ secrets.E2E_FIXTURE_GITHUB_TOKEN }}
          persist-credentials: false
          path: target/fixtures/native-task-fixtures
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Validate immutable release inputs
        run: |
          set -euo pipefail
          [[ "$RELEASE_CHANNEL" =~ ^(rc|stable)$ ]]
          test -n "$RELEASE_TAG"
          test -n "$HARNESS_E2E_MODEL"
          test -n "$HARNESS_E2E_PROVIDER"
          test -n "$III_URL"
          test -n "$OFFICIAL_VERIFIER_B64"

      - name: Prepare trusted experiment inputs
        run: |
          set -euo pipefail
          mkdir -p target/native-task-release
          mkdir -p "$RUNNER_TEMP/harness-e2e-official"
          printf '%s' "$OFFICIAL_VERIFIER_B64" | base64 --decode > "$RUNNER_TEMP/harness-e2e-official/verifier.json"
          components=${COMPONENTS_JSON:-null}
          if [[ "$components" = null ]]; then components='{}'; fi
          comparison_series=stable
          if [[ "$RELEASE_CHANNEL" = rc ]]; then
            comparison_series="rc:${RELEASE_TAG%%-rc.*}"
          fi
          jq -n \
            --arg lane remote_release \
            --arg comparison_series "$comparison_series" \
            --arg stack_mode registry \
            --arg release_channel "$RELEASE_CHANNEL" \
            --arg release_tag "$RELEASE_TAG" \
            --arg runner_revision "$GITHUB_SHA" \
            --arg platform "$RUNNER_OS-$RUNNER_ARCH" \
            --argjson components "$components" \
            '{lane:$lane,comparison_series:$comparison_series,stack_mode:$stack_mode,release_channel:$release_channel,release_tag:$release_tag,runner_revision:$runner_revision,platform:$platform,components:$components}' \
            > target/native-task-release/system.json

      - name: Build and validate the evaluator
        run: |
          cargo build --locked --release --bin harness-e2e
          target/release/harness-e2e tasks validate > target/native-task-release/catalog.json

      - name: Run five-sample official task cohort
        id: tasks
        continue-on-error: true
        run: |
          suite="config/task-suites/remote-${RELEASE_CHANNEL}.json"
          target/release/harness-e2e tasks run-suite \
            --suite "$suite" \
            --system-manifest target/native-task-release/system.json \
            --official-verifier-bundle "$RUNNER_TEMP/harness-e2e-official/verifier.json" \
            --output target/native-task-release/tasks \
            --model "$HARNESS_E2E_MODEL" \
            --provider "$HARNESS_E2E_PROVIDER"

      - name: Run one uninterrupted endurance session
        id: endurance
        continue-on-error: true
        run: |
          target/release/harness-e2e run \
            --scenario engineering_endurance_ladder \
            --runs 1 \
            --technical-retries 0 \
            --output target/native-task-release/endurance \
            --model "$HARNESS_E2E_MODEL" \
            --provider "$HARNESS_E2E_PROVIDER"

      - name: Retain advisory evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-task-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/native-task-release/
          retention-days: 90
          if-no-files-found: error

      - name: Remove private verifier material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/harness-e2e-official/verifier.json"
          rmdir "$RUNNER_TEMP/harness-e2e-official" 2>/dev/null || true

name: Harness E2E campaign runner

on:
  workflow_call:
    inputs:
      campaign:
        description: Checked-in campaign id under config/campaigns
        required: true
        type: string
      timeout_minutes:
        description: Maximum wall time for the complete campaign
        required: true
        type: number

permissions:
  contents: read

jobs:
  campaign:
    if: endsWith(github.workflow_ref, '@refs/heads/main')
    runs-on: [self-hosted, harness-e2e]
    environment: harness-e2e-trusted
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      HARNESS_E2E_MODEL: ${{ vars.HARNESS_E2E_MODEL }}
      HARNESS_E2E_PROVIDER: ${{ vars.HARNESS_E2E_PROVIDER }}
      HARNESS_E2E_ENGINEERING_FIXTURE_REPOSITORY: ${{ vars.HARNESS_E2E_ENGINEERING_FIXTURE_REPOSITORY }}
      ENGINEERING_TICKET_FIXTURE_REVISION: 7a6b25b3cd12d66af74a358ae86e0d2b846bd384
      III_URL: ${{ vars.III_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm --dir dashboard install --frozen-lockfile
      - run: pnpm --dir dashboard build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the trusted evaluator
        run: cargo build --locked --release --bin harness-e2e
      - name: Validate the campaign and trusted runtime
        env:
          CAMPAIGN: ${{ inputs.campaign }}
        run: |
          python3 scripts/run_e2e_campaign.py "config/campaigns/${CAMPAIGN}.json" --validate-only
          test -x /opt/iii-harness-e2e/archive-trusted-execution
          test -n "${HARNESS_E2E_MODEL:-}"
          test -n "${HARNESS_E2E_PROVIDER:-}"
          test -n "${III_URL:-}"
          if [[ "$CAMPAIGN" == "daily" ]]; then
            test -x /opt/iii-harness-e2e/engineering-ticket-fixture
            test -n "${HARNESS_E2E_ENGINEERING_FIXTURE_REPOSITORY:-}"
          fi
      - name: Prepare the disposable engineering fixture
        if: inputs.campaign == 'daily'
        run: |
          execution_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fixture_json="$RUNNER_TEMP/engineering-ticket-fixture-${execution_id}.json"
          /opt/iii-harness-e2e/engineering-ticket-fixture prepare \
            --execution-id "$execution_id" \
            --revision "$ENGINEERING_TICKET_FIXTURE_REVISION" > "$fixture_json"
          lease=$(jq -er .lease_id "$fixture_json")
          trap '/opt/iii-harness-e2e/engineering-ticket-fixture cleanup --lease-id "$lease"' ERR
          jq -e \
            --arg revision "$ENGINEERING_TICKET_FIXTURE_REVISION" \
            '.revision == $revision and (.path | startswith("/")) and (.lease_id | length == 32)' \
            "$fixture_json"
          echo "HARNESS_E2E_ENGINEERING_TICKET_FIXTURE_PATH=$(jq -er .path "$fixture_json")" >> "$GITHUB_ENV"
          echo "HARNESS_E2E_ENGINEERING_TICKET_FIXTURE_LEASE=$lease" >> "$GITHUB_ENV"
          trap - ERR
      - name: Run the advisory campaign
        env:
          CAMPAIGN: ${{ inputs.campaign }}
        run: |
          execution_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/run_e2e_campaign.py "config/campaigns/${CAMPAIGN}.json" \
            --advisory \
            --e2e-bin "$PWD/target/release/harness-e2e" \
            --output-root "$PWD/campaign-results" \
            --execution-id "$execution_id" \
            --summary "$PWD/campaign-results/campaign-summary.json"
      - name: Remove the disposable engineering fixture
        if: always()
        run: |
          lease="${HARNESS_E2E_ENGINEERING_TICKET_FIXTURE_LEASE:-}"
          test -z "$lease" || \
            /opt/iii-harness-e2e/engineering-ticket-fixture cleanup --lease-id "$lease"
      - name: Archive every materialized group
        if: always()
        run: |
          summary="$PWD/campaign-results/campaign-summary.json"
          test -f "$summary" || exit 0
          while IFS= read -r output; do
            results="$output/results.json"
            manifest="$output/manifest.json"
            if [[ ! -f "$results" || ! -f "$manifest" ]]; then
              continue
            fi
            execution_id=$(jq -er .execution.execution_id "$manifest")
            archive=(
              /opt/iii-harness-e2e/archive-trusted-execution
              --execution-id "$execution_id"
              --retention longitudinal
              --include "$manifest"
              --include "$results"
              --include "$summary"
              --output "$output/archive-head.json"
            )
            if [[ -f "$output/observation.json" ]]; then
              archive+=(--include "$output/observation.json")
            fi
            "${archive[@]}"
            jq -e '
              .availability == "available" and
              (.archive.manifest.uri | startswith("iii-storage://")) and
              ((.archive.manifest.sha256 | sub("^sha256:"; "") | length) == 64)
            ' "$output/archive-head.json"
          done < <(jq -r '.groups[].output' "$summary")
      - name: Publish the advisory summary
        if: always()
        run: |
          summary="$PWD/campaign-results/campaign-summary.json"
          if [[ -f "$summary" ]]; then
            jq -r '
              "### Harness E2E campaign: \(.campaign_id)\n",
              "Objective passed: `\(.objective_passed)`\n",
              (.groups[] | "- `\(.group_id)`: \(.status) (exit=\(.exit_code // "n/a"), duration=\(.duration_ms)ms)")
            ' "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Harness E2E campaign did not produce a summary.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain a short diagnostic fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-e2e-${{ inputs.campaign }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: campaign-results
          retention-days: 30
          if-no-files-found: warn

namespace: harness-e2e

containers:
  harness-e2e:
    worker: path://.
    config_override:
      data_dir: ~/.iii/data/harness-e2e
      control_database: harness_e2e
    start_after: [database]
    scripts:
      run: cargo run --locked --bin harness-e2e
  database:
    worker: package://api.workers.iii.dev/database
    version: "^0.5.20"

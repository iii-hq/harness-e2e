# The stack a campaign measures.
#
# This file declares which workers run as containers. Everything else in the
# graph — state, llm-router, iii-directory, session-manager and the rest — is a
# dependency the engine resolves from the package, not something declared here.
#
# `latest` is the selector. Release Control overrides it per worker through
# stack.json when an execution has to be pinned to a release.
#
# The executor stamps three things at run time, because they are per shard and
# cannot be written down: the namespace, the runner's data_dir, and the private
# env files that carry provider credentials.

containers:
  # The application under test. Its package graph is the stack being measured.
  harness:
    worker: package://harness
    version: latest

  # The runner that executes the scenarios inside that stack.
  harness-e2e:
    worker: package://harness-e2e
    version: latest

  # Workers the measurement itself needs and that the application does not
  # bring along. A worker the application already depends on is left out: the
  # engine resolves it from that dependency, and declaring it here as well is a
  # second, independent spec for the same worker, which it refuses.
  # `browser` is one of those, and arrives with `harness`.
  fp:
    worker: package://fp
    version: latest

  provider-deepseek:
    worker: package://provider-deepseek
    version: latest

  provider-zai:
    worker: package://provider-zai
    version: latest

startup_timeout: 5m
stop_timeout: 30s

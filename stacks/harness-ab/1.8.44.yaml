# Harness A/B arm: every worker at the version execution
# 98147b79-823c-4cc6-80d1-ffc64842b9c2 (regression, 2026-10-19 05:17 UTC,
# harness 1.8.56) resolved, from its worker-compose.lock; only `harness`
# changes between arms. The dependencies are declared with the edges Compose
# wrote, so the executor holds them at these versions (see the README).
# The runner is held at harness-e2e 0.21.0 instead, the first that records
# each run's cause and carries software-engineering-x9 and regression-x11.

iii: 0.24.6-rc.5
containers:
  harness:
    worker: package://harness
    version: 1.8.44
    start_after:
    - ade
    - context-manager
    - cron
    - ide
    - iii-directory
    - judge
    - llm-router
    - provider-anthropic
    - provider-openai
    - provider-openai-codex
    - queue
    - session-manager
    - state
  harness-e2e:
    worker: package://harness-e2e
    version: 0.21.0
    start_after:
    - browser
    - database
    - storage
  fp:
    worker: package://fp
    version: 0.2.21
  provider-deepseek:
    worker: package://provider-deepseek
    version: 0.1.20
  provider-zai:
    worker: package://provider-zai
    version: 0.5.16
    start_after:
    - llm-router
    - state
  ade:
    worker: package://ade
    version: 1.9.65
  cron:
    worker: package://cron
    version: 0.21.25
  ide:
    worker: package://ide
    version: 0.12.32
  iii-directory:
    worker: package://iii-directory
    version: 1.2.40
  judge-typesafe:
    worker: package://judge-typesafe
    version: 0.2.5
  judge:
    worker: package://judge
    version: 0.2.10
    start_after:
    - judge-typesafe
  queue:
    worker: package://queue
    version: 0.21.21
  secrets:
    worker: package://secrets
    version: 0.1.4
  session-manager:
    worker: package://session-manager
    version: 1.0.34
  state:
    worker: package://state
    version: 0.22.19
  llm-router:
    worker: package://llm-router
    version: 1.4.36
    start_after:
    - secrets
    - state
  context-manager:
    worker: package://context-manager
    version: 1.1.21
    start_after:
    - llm-router
  provider-anthropic:
    worker: package://provider-anthropic
    version: 1.2.27
    start_after:
    - llm-router
    - state
  provider-openai:
    worker: package://provider-openai
    version: 1.2.26
    start_after:
    - llm-router
    - state
  provider-openai-codex:
    worker: package://provider-openai-codex
    version: 0.4.26
    start_after:
    - llm-router
    - state
  browser:
    worker: package://browser
    version: 0.2.31
  database:
    worker: package://database
    version: 0.5.21
  storage:
    worker: package://storage
    version: 0.1.24
startup_timeout: 5m
stop_timeout: 30s


# The stack the `memory` suite runs on: the default stack plus the memory
# worker, which the Harness does not bring. Memory's own dependencies
# (configuration, session-manager, llm-router, state, queue) all arrive with
# the Harness graph, so only memory is declared. Keep the other containers in
# step with default.yaml.
#
# Embeddings: iii-directory's local MiniLM (provider::minilm::embed) is
# router::embed's fallback when no registered provider has an embed key. The
# published Linux builds carry no MiniLM, so there memory ranks lexical-only
# (BM25 and entities); either way recall ranks the same on every run. An
# OPENAI_API_KEY reaching llm-router moves memory to text-embedding-3-small;
# the suite's setup refuses it and records which mode ran.

iii: latest

containers:
  # The application under test. Its package graph is the stack being measured.
  harness:
    worker: package://harness
    version: latest

  # The worker under test.
  memory:
    worker: package://memory
    version: latest

  # The runner that executes the scenarios inside that stack.
  harness-e2e:
    worker: package://harness-e2e
    version: latest

  fp:
    worker: package://fp
    version: latest

  provider-deepseek:
    worker: package://provider-deepseek
    version: latest

  provider-zai:
    worker: package://provider-zai
    version: latest

startup_timeout: 5m
stop_timeout: 30s
